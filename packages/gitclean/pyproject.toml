[project]
name = "gitclean"
version = "0.1.0"
description = "gitclean — surveys git worktrees and branches, classifies deletion risk, and cleans up what is verifiably safe."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gitclean = "gitclean.cli:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitclean"]

[dependency-groups]
dev = [
  "pytest",
  "pytest-xdist",
  "pytest-cov",
  "ruff",
  "mypy",
  "pip-audit",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W", "F",
  "I",
  "B",
  "UP",
  "SIM",
  "S",
  "RET", "ARG", "PTH",
  "TRY",
  "RUF",
  "N",
]

[tool.ruff.lint.per-file-ignores]
# S101: pytest's `assert` is the standard assertion mechanism. TRY003: a fake
# that fails loudly must name what the script did not cover, in the failure
# itself -- that is the whole diagnostic.
"tests/**" = ["S101", "TRY003"]
# S603/S607: the ONLY module that shells out. argv is always a fixed list with
# no shell; `git`/`gh` are resolved from PATH deliberately (respecting the
# caller's toolchain selection) rather than pinned to an absolute path.
# TRY003: ScriptedCommands must name the exact argv it had no answer for --
# that message IS the diagnostic, and routing it through a message-builder
# would hide which git question production asked that the test never scripted.
"src/gitclean/ports.py" = ["S603", "S607", "TRY003"]
# TRY003: every anomaly message names the specific command and mismatch inline
# -- an agent reads these to remediate, so a generic message-builder would
# destroy exactly the context the tool exists to supply.
"src/gitclean/execute.py" = ["TRY003"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.mypy]
strict = true
warn_unreachable = true
disallow_any_decorated = true
enable_error_code = ["redundant-expr", "truthy-bool", "possibly-undefined"]

[tool.coverage.run]
branch = true
source = ["src/gitclean"]

[tool.coverage.report]
fail_under = 90
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "@overload"]
show_missing = true
skip_covered = true
