<!--
  The grilling session's surface. One file, no build, no frameworks, no CDN —
  the reference page's own convention, kept because a page the backend serves
  off disk has nothing to build it with.

  The backend owns the session. It holds the append-only log, mints the epoch,
  assigns every sequence, and folds the board. This page asks for that board and
  renders it; it never decides what the board says. Three consequences run
  through everything below:

    - the board is the state read. Nothing here re-folds the log into decisions,
      statuses, answers or a queue. A page that believed something the log did
      not say would be wrong by construction, and the way that goes wrong is
      quiet: the human acts on a board nobody else can see.
    - which of an agent's changes waited for the human is the backend's answer,
      decided when the change arrived. This page renders the queue it is given.
      Re-deriving that rule here is the same failure at one remove — two
      classifiers that agree until the moment they do not.
    - every write is one event with an idempotency key, answered by a typed
      receipt. A rejection is shown, because a refusal the human cannot see is
      a message they believe they sent.

  Read paths: the state read for the board, the update read for what has
  happened since. The doctor check is a control, not board content. Nothing
  else is read.
-->
