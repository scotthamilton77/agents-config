[project]
name = "prgroom"
version = "0.1.0"
description = "prgroom — deterministic PR-grooming CLI: polls PR review feedback, clusters it, dispatches fixes, pushes, replies, and resolves threads."
requires-python = ">=3.11"
dependencies = ["typer"]

[project.scripts]
prgroom = "prgroom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prgroom"]

[dependency-groups]
dev = [
  "pytest",
  "pytest-xdist",
  "pytest-cov",
  "ruff",
  "mypy",
  "pip-audit",
  "mutmut>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W", "F",
  "I",
  "B",
  "UP",
  "SIM",
  "S",
  "RET", "ARG", "PTH",
  "TRY",
  "RUF",
  "N",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S101"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
warn_unreachable = true
disallow_any_decorated = true
enable_error_code = ["redundant-expr", "truthy-bool", "possibly-undefined"]

[tool.pytest.ini_options]
# The mutation gate leaves a whole copy of the package under mutants/. Without
# this, a bare `pytest` collects that copy's tests as well as the real ones.
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src/prgroom"]
pytest_add_cli_args_test_selection = ["tests"]
# Survivors tolerated before the mutation gate fails: a ratchet set at the
# measured standing count over the App-approver modules, where every survivor is
# a diagnostic-string or argument-nulling mutant no test is written to pin. It
# is a count, not a rate, so it does not scale with the module set — reading it
# against a much smaller or much larger selection reads it wrong.
max_survivors = 126

[tool.coverage.run]
branch = true
source = ["src/prgroom"]

[tool.coverage.report]
fail_under = 90
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "@overload"]
show_missing = true
skip_covered = true
