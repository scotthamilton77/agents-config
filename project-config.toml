# project-config.toml
# Per-project configuration, read at the repository root.
#
# Only three consumers read this file, and between them they read four sections:
#   workcli   -- [tracks], [operating-model], [extraction.pressure],
#                [extraction.eligibility]
#   installer -- [install] (the persisted profile selection; absent until the
#                installer writes it)
#   scripts/track-backfill -- [tracks]
#
# Anything else here is prose for a human, not configuration. Two conventions
# hold, and they are what keep this file honest:
#
#   A commented-out key is future work nothing reads. Uncomment one only in
#   the change that deploys its reader.
#
#   A section states who reads it. If no live consumer can be named, the
#   section does not belong here -- the mechanical gates are declared in the
#   Makefile and nowhere else.

[project]
name = "agents-config"

# ---------------------------------------------------------------------------
# [merge-policy] — merge authorization.
# Read by: no code. The root AGENTS.md sends a reader here to confirm that no
#          rule-based policy is configured, so the live key below is the answer
#          to that question and exists for that reason alone.
#
# Commented-out keys anticipate future work (agents-config-9k9.69) and are not
# policy. Uncomment a key only in the change that deploys something reading it.
# ---------------------------------------------------------------------------
[merge-policy]
# The agent merges only on an explicit in-session human instruction.
merge-authorization = "explicit"

# Anticipates future work: autonomous merge once the selected rule holds. What is
# missing is the approving review the branch ruleset accepts (agents-config-9k9.23);
# reinstating the authorization itself is agents-config-9k9.64.
#
# An eligibility evaluator does ship, and it is not the one this anticipates:
# `prgroom status --json` emits `auto_merge_eligible`, the AND of four gates
# (packages/prgroom/src/prgroom/lifecycle/status.py). It is derived from prgroom's
# own bot quiescence, which the charter supersedes, and no term in it consults a
# review verdict. Read a true value there as a report on grooming, never as an
# authorization to merge — nothing stands behind it as one.
# merge-authorization = "rule-based"
# merge-rule          = "bot-quiescence"

# Anticipates future work: a GitHub-App-attested approving review satisfying branch
# protection on an authorized autonomous merge.
# Design: docs/specs/2026-07-11-merge-approver-app-design.md
# [merge-policy.approver]
# type         = "github-app"
# app-id       = 4275336
# key-path-env = "MERGE_GUARD_APPROVER_KEY_PATH"

# Anticipates future work: which reviews to expect, and how many human approvals a
# merge needs. Reviews are fetched today — `prgroom poll` queries gh for review
# items, reviews and CI status — but nothing turns that into an expected-reviewer
# set or an approval count, so these keys would have no reader if uncommented.
# [review-expectations]
# bot-review-expected      = true
# bot-reviewers            = ["Copilot", "copilot-pull-request-reviewer[bot]", "chatgpt-codex-connector[bot]"]  # exact identities, never substrings
# human-approvers-required = 0

# ---------------------------------------------------------------------------
# Anticipates future work: tier-routing thresholds for a SKIP/SERIAL/HEAVY
# completion gate. No gate reads these, and the companion .critical-paths file
# selects nothing. Uncomment in the change that deploys a tier router.
# ---------------------------------------------------------------------------
# [completion-gate]
# heavy_min_files      = 8
# heavy_min_loc        = 400
# heavy_min_subsystems = 3
# trivial_max_loc      = 3   # SKIP ceiling; hard-capped at 20 on load

# ---------------------------------------------------------------------------
# [tracks] / [operating-model] / [extraction] — work-tracker track partition
# Read by: workcli (work create gate, work list --track, work track set,
#          work lint, work graph, work triggers, work groom).
# Contract: docs/specs/2026-07-15-workcli-track-partition-design.md §3 — the
#           track model, the per-track charters, and the §3.1-§3.6 rules that
#           decide which track an item takes. This file is authoritative for the
#           names; that section is their charter.
# ---------------------------------------------------------------------------
[tracks]
names = ["installer", "prgroom", "workcli", "pdlc-orchestrator",
         "holding-place", "vizsuite", "review-and-merge",
         "pipeline-discipline", "grind-runtime", "ops-meta"]
# grind-runtime was organizing-only pending a package; packages/grind now exists,
# so it is extractable and `work triggers` evaluates it.
organizing-only = ["pipeline-discipline", "ops-meta"]
enforcement = "required"   # an underivable create fails E_TRACK_REQUIRED and writes nothing

[operating-model]
milestone-wip-cap = 2
wip-exempt-milestones = ["agents-config-uxns2"]  # PORT — work item id, never display name
backlog-groom-nag-days = 7
groom-state-item = "agents-config-t8o"   # minted 2026-08-05 per the backfill design §5.6

[extraction.pressure]
max-track-backlog = 100
external-consumer-tracks = []
independent-release-tracks = []

[extraction.eligibility]
max-cross-track-edges = 3

# Foreign-CLI model selection is not configured here. The Codex plugin's runtime
# leaves the model unset unless a caller names one, and the skill that routes a
# task profile to a tier carries that table itself — one place, versioned with
# the skill that uses it.
