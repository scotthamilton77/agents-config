# work — project configuration.
#
# Generated by `work init`. This file is the whole of the vocabulary the `work`
# facade validates but does not author: what your nouns are called and what
# each one mints, why work parks, why in-scope work is deferred. Nothing here
# has a default compiled into the tool -- if a key is missing, the verbs that
# need it refuse and say so, rather than falling back to a vocabulary you
# never chose.
#
# The discipline these words are fed to is not configurable: that a container
# closes when its children close, that a delivery needs evidence, that a
# discovery states its scope and its anchor.

[workcli]
config-schema = 1

[tracks]
names = ["installer", "prgroom", "review-and-merge", "pipeline-discipline", "grind-runtime", "ops-meta", "grilling"]
organizing-only = ["pipeline-discipline", "ops-meta"]
enforcement = "required"

[operating-model]
milestone-wip-cap = 2
wip-exempt-milestones = ["agents-config-uxns2"]
backlog-groom-nag-days = 7
groom-state-item = "agents-config-t8o"

[extraction]

[extraction.pressure]
max-track-backlog = 100
external-consumer-tracks = []
independent-release-tracks = []

[extraction.eligibility]
max-cross-track-edges = 3

# The nouns this project files work under. `type` is what the tracker stamps on
# the item; `shape-label` records the decision on the item itself, so it stays
# legible after the fact and cannot be forged through `--label`. `container`
# items hold other work and close when it closes; leaves are claimed and
# delivered. `expects-evidence` marks the nouns whose creation may declare a
# spec or a triviality up front.
[taxonomy]
# Item types that count as a container even on an item carrying no shape label,
# which is how work created before the labels existed still reads correctly.
# This list is separate from the nouns above rather than derived from them
# because a type does not identify a noun: `spec` and `feat` below are both
# stamped `feature`, so deriving the list would make every feature a container
# and every feat unclaimable. Name here only the types you mean.
container-types = ["epic", "milestone"]
# Label namespaces `--label` may never write into. The shape labels above are
# already reserved by name; this reserves the whole prefix, so a caller cannot
# mint `shape-` state for a noun you have not declared.
reserved-label-prefixes = ["shape-"]
# The type stamped on the design child and placeholder a spec container mints
# for itself. Those two are not nouns -- no caller creates one -- but they are
# stored items someone will read, so they get a word here too.
structural-child-type = "task"

# Three fixed rules need to know which noun they are about. Rename a noun below
# and rename it here too, or the rule silently stops matching. The
# roadmap-anchor additionally has to be the ONLY noun stamped with its type:
# the close-walk and the lint sweep identify an anchor by the type on the item,
# so a second noun sharing it would turn every item of that noun into an anchor.
[taxonomy.roles]
roadmap-anchor = "milestone"   # never auto-closes; track-exempt; what `lint` looks for overhead
spec-container = "spec"        # creating one instantiates a design child and a placeholder
promotable-leaf = "feat"       # what `work promote` turns into a spec container

[taxonomy.aliases]
bug = "bugfix"                 # 'bug' names the thing found; 'bugfix' names the remedy

[taxonomy.nouns.spike]
type = "task"
shape-label = "shape-spike"
container = false
expects-evidence = false

[taxonomy.nouns.chore]
type = "chore"
shape-label = "shape-chore"
container = false
expects-evidence = false

[taxonomy.nouns.decision]
type = "decision"
shape-label = "shape-decision"
container = false
expects-evidence = false

[taxonomy.nouns.feat]
type = "feature"
shape-label = "shape-feat"
container = false
expects-evidence = true

[taxonomy.nouns.bugfix]
type = "bug"
shape-label = "shape-bugfix"
container = false
expects-evidence = true

[taxonomy.nouns.spec]
type = "feature"
shape-label = "shape-spec"
container = true
expects-evidence = false

[taxonomy.nouns.epic]
type = "epic"
shape-label = "shape-epic"
container = true
expects-evidence = false

[taxonomy.nouns.milestone]
type = "milestone"
shape-label = "shape-milestone"
container = true
expects-evidence = false

# Why a work item's change could not merge. `machine` marks a cause an
# automated executor can retry into; `human` marks one that needs a person.
# The category grants no exit either way -- parked work is always walked back
# by hand, through `work redispatch` or `work abandon`.
[park]
stale-days = 7                 # how old a parked item gets before `ready`/`claim` surface it

[park.reasons]
ci-failure = "machine"
merge-conflict = "machine"
approval-required = "human"
bot-declined = "human"
budget-exhausted = "human"

# The sanctioned reasons in-scope work is filed for later rather than done now.
# `work discover --scope in-scope-deferred:HATCH` accepts exactly these.
[discover]
hatches = ["externally-blocked", "blast-radius", "own-cycle"]

[lint]
# Whether every item is expected to sit under a roadmap anchor. Roadmap
# organization is your call, not the tool's; `lint-exempt:no-milestone` exempts
# one item while the rule is on.
require-anchor-ancestor = true

[deliver]
# The heading `work deliver --spec` reads a spec's continuations manifest
# under. The bullet grammar beneath it is fixed.
continuations-heading = "## Continuations"
