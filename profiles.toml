schema = 1

# Default destination scope per selector. Keys are the normalized selector
# vocabulary (§3). Every staged item must match one of these (or an explicit
# include-entry scope), else resolution errors. `instructions` and `settings`
# are the synthetic tool-root selectors.
[scopes]
"instructions" = "user"
"settings"     = "user"
"rules/**"     = "user"
"skills/**"    = "user"
"agents/**"    = "user"
"commands/**"  = "user"
"workflows/**" = "user"
"hooks/**"     = "user"
"kits/**"      = "project"

# Today's behavior: install everything, user-scoped. The zero-breakage default.
[profiles.full]
include = ["**"]

# A deliberately tiny user install. Selectors must match the staged universe —
# a dead selector fails the install loud — so this lists only what exists.
# `rules/**`, `agents/**`, and `commands/**` are absent from the universe today:
# every artifact in them was record-less and moved to `archive/`. Re-add the
# selectors here in the same change that readmits content into those namespaces.
[profiles.minimal-user]
include = ["instructions"]

# The SDLC discipline content. `workflows/**` is absent from the universe today:
# the last workflow (quality-gate.js) was quarantined to `archive/` on 2026-07-25
# (revisit tracked as agents-config-9k9.17.6). Re-add the selector here in the
# same change that readmits content into that namespace.
[profiles.sdlc]
include = ["skills/**"]

# The beads project kit. Project-scoped. Its only content — a PRIME.md staged to
# <project>/.beads/PRIME.md — moved to archive/src/kits/ on 2026-07-26, so this
# selector matches nothing in this repo's own tree today and a real
# `--profiles=beads-kit` run against it stages zero files. The profile is kept
# because the installer's project-scope tests use it as their fixture selector
# (test_cli_project.py, test_profiles.py) against hermetic repo roots that supply
# their own kit content. Removing it is an installer-test change, not a
# profiles.toml edit.
[profiles.beads-kit]
include = ["kits/beads/**"]
