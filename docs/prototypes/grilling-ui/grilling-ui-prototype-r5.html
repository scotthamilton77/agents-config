<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE R5 — Grilling session over a server-authoritative backend</title>
<!--
  THROWAWAY PROTOTYPE, round 4. One file, no build, no frameworks, no CDN.

  Rounds 1 to 3 settled the surface against a canned agent that lived in this
  same file on a timer. Round 4 removed it in favour of a mail slot this page
  still had to think for. Round 5 removes the thinking too: a backend owns the
  event log on disk, stamps the only sequence that orders anything, and mints
  its own agents. This page asks it for the board and renders what comes back.

    python3 backend.py --session /tmp/grill-a --handoff handoff.json
    open http://127.0.0.1:8379/grilling-ui-prototype-r5.html

  This page must be served by that backend, not opened by double-click: with no
  backend, it shows a banner and no reply ever arrives. HANDOFF.md is the file
  that starts a session; SPIKE5-REPORT.md is what this round measured.

  The pure state module below is DOM-free and network-free — the server I/O is
  in the second script, outside the fence. It is fenced by two marker comments
  and carries an assert-based self-check that runs when it is executed outside
  a browser. BUILD-REPORT-R4.md holds the exact extract-and-run command; the
  markers are deliberately not repeated in this comment, because an extractor
  that splits on them would otherwise slice this comment instead of the module.

  localStorage keys are namespaced under grillproto4.* — every file:// page
  shares one origin in Chrome, so an unnamespaced key would collide with any
  other prototype opened from disk. "Reset" clears them.
-->
<style>
  :root {
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --ink: #1e293b;
    --ink-dim: #64748b;
    --ink-faint: #94a3b8;
    --line: #e2e8f0;
    --paper: #ffffff;
    --page: #f8fafc;
    --settled-bg: #f0fdf4; --settled-line: #86efac; --settled-ink: #15803d;
    --stale-bg: #fffbeb;   --stale-line: #fcd34d;  --stale-ink: #b45309;
    --conflict-bg: #fef2f2; --conflict-line: #fca5a5; --conflict-ink: #b91c1c;
    --blocked-bg: #f8fafc; --blocked-line: #e2e8f0;
    --mandate-bg: #ecfeff; --mandate-line: #67e8f9; --mandate-ink: #0e7490;
    --pend-bg: #eff6ff; --pend-line: #93c5fd; --pend-ink: #1d4ed8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  button { font: inherit; cursor: pointer; }
  button:disabled { cursor: default; opacity: .45; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .shell { max-width: 1560px; margin: 0 auto; padding: 24px 24px 40px; }
  .marker {
    display: inline-block; font: 600 11px/1 ui-monospace, Menlo, monospace;
    letter-spacing: .12em; text-transform: uppercase;
    color: #b45309; background: #fef3c7; border: 1px solid #fcd34d;
    padding: 6px 10px; border-radius: 999px; margin-bottom: 14px;
  }
  .intro { max-width: 88ch; }
  .intro h1 { font-size: 23px; margin-bottom: 8px; }
  .intro p { color: var(--ink-dim); margin: 0 0 8px; font-size: 14px; }

  details.note { margin-top: 12px; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 14px; }
  details.note summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--accent); }
  details.note table { border-collapse: collapse; margin-top: 10px; font-size: 12.5px; width: 100%; }
  details.note td, details.note th { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
  details.note th { color: var(--ink-faint); font-weight: 600; text-transform: uppercase; font-size: 10.5px; letter-spacing: .07em; }
  details.note .k { white-space: nowrap; font: 600 11.5px ui-monospace, Menlo, monospace; color: var(--accent); }

  /* ---------- scenario bar ---------- */
  .scenarios { margin: 18px 0 16px; border: 1px solid var(--line); background: var(--paper); border-radius: 12px; }
  .tabs { display: flex; gap: 2px; padding: 6px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
  .tabs button {
    border: 0; background: transparent; color: var(--ink-dim);
    padding: 7px 13px; border-radius: 7px; font-size: 13px; font-weight: 500;
  }
  .tabs button:hover { background: var(--page); }
  .tabs button.on { background: var(--accent); color: #fff; }
  .tabs .spacer { flex: 1; }
  .scen-body { padding: 13px 16px 15px; }
  .scen-body p { margin: 0 0 11px; color: var(--ink-dim); font-size: 13.5px; max-width: 92ch; }
  .steps { display: flex; flex-direction: column; gap: 5px; }
  .step {
    display: flex; align-items: center; gap: 10px; text-align: left;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    border-radius: 8px; padding: 8px 12px; font-size: 13.5px;
  }
  .step .n { font: 600 11px ui-monospace, Menlo, monospace; color: var(--ink-faint); min-width: 16px; }
  .step.now { border-color: var(--accent); background: var(--accent-soft); font-weight: 500; }
  .step.done { color: var(--ink-faint); background: var(--page); }
  .step.done .n::after { content: " ✓"; color: var(--settled-ink); }
  .step .wait { margin-left: auto; font-size: 11.5px; color: var(--stale-ink); font-style: italic; }

  /* ---------- status vocabulary ---------- */
  .pill { display: inline-block; font: 600 10px/1 ui-monospace, Menlo, monospace;
          letter-spacing: .07em; text-transform: uppercase; padding: 4px 7px; border-radius: 5px; }
  .pill.settled { background: var(--settled-bg); color: var(--settled-ink); border: 1px solid var(--settled-line); }
  .pill.open    { background: var(--accent-soft); color: var(--accent); border: 1px solid #c7d2fe; }
  .pill.stale   { background: var(--stale-bg); color: var(--stale-ink); border: 1px solid var(--stale-line); }
  .pill.blocked { background: var(--blocked-bg); color: var(--ink-faint); border: 1px solid var(--line); }
  .pill.fogged  { background: #f1f5f9; color: var(--ink-faint); border: 1px dashed var(--ink-faint); }
  .pill.conflicted { background: var(--conflict-bg); color: var(--conflict-ink); border: 1px solid var(--conflict-line); }
  /* R8: downstream of a conflict is quiet, not loud. Only the conflicted node is red. */
  .pill.conflict-blocked { background: var(--blocked-bg); color: var(--ink-faint); border: 1px solid var(--line); }
  .pill.reassessing { background: #f5f3ff; color: #6d28d9; border: 1px dashed #c4b5fd; }
  .pill.awaiting-thread { background: var(--mandate-bg); color: var(--mandate-ink); border: 1px solid #a5f3fc; }
  .pill.invalidated { background: #f8fafc; color: var(--ink-faint); border: 1px dashed var(--ink-faint); text-decoration: line-through; }
  .pill.new { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .pill.locked { background: var(--pend-bg); color: var(--pend-ink); border: 1px solid var(--pend-line); }

  @keyframes surface { from { box-shadow: 0 0 0 5px rgba(79,70,229,.25); } to { box-shadow: 0 0 0 5px rgba(79,70,229,0); } }
  .fresh { animation: surface 1.8s ease-out 1; }
  @keyframes touched { 0% { background: #fff7ed; } 100% { background: transparent; } }
  .touched { animation: touched 2.2s ease-out 1; }
  @keyframes mailpulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
  .mail { animation: mailpulse 1.4s ease-in-out infinite; }
  @keyframes alertflash { 0%,100% { box-shadow: 0 0 0 0 rgba(185,28,28,0); } 50% { box-shadow: 0 0 0 4px rgba(185,28,28,.26); } }
  .alerting { animation: alertflash 1.5s ease-in-out infinite; }
  /* U14: the settled block reads as compacting — but with no layout effect. An
     animated max-height was still resizing while the auto-advance scroll measured
     where to go, which landed the next decision above the panel's top edge. */
  @keyframes compact { from { opacity: .35; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .item.justsettled { animation: compact .35s ease-out 1; }

  .btn {
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    border-radius: 8px; padding: 7px 12px; font-size: 13px;
  }
  .btn:hover:not(:disabled) { border-color: var(--ink-faint); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .btn.primary:hover:not(:disabled) { background: #4338ca; }
  .btn.warn { background: var(--conflict-ink); border-color: var(--conflict-ink); color: #fff; font-weight: 500; }
  .btn.wide { width: 100%; text-align: left; }
  .btn.sm { padding: 5px 9px; font-size: 12px; }

  .q-body { color: var(--ink-dim); font-size: 13.5px; margin: 8px 0 12px; }
  .rec-line { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 6px; }
  .alts { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
  .free { display: flex; gap: 6px; margin-top: 8px; }
  .free textarea {
    flex: 1; font: inherit; font-size: 13px; padding: 7px 9px; resize: vertical;
    border: 1px solid var(--line); border-radius: 8px; min-height: 38px;
  }
  .free textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .free .hint { font-size: 10.5px; color: var(--ink-faint); align-self: flex-end; padding-bottom: 8px; white-space: nowrap; }
  .prior { font-size: 12.5px; color: var(--ink-dim); border-left: 3px solid var(--line); padding-left: 10px; margin: 6px 0; }
  .muted { color: var(--ink-dim); font-size: 12.5px; }
  .did { font: 600 10px ui-monospace, Menlo, monospace; color: var(--ink-faint); letter-spacing: .08em; }

  /* ---------- top bar ---------- */
  .topbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .agentchip {
    display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-dim);
    background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
  }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: #cbd5e1; }
  .dot.busy { background: var(--accent); animation: mailpulse 1s ease-in-out infinite; }
  .pendbtn { border: 1px solid var(--pend-line); background: var(--pend-bg); color: var(--pend-ink);
             border-radius: 999px; padding: 6px 14px; font-size: 12.5px; font-weight: 600; }
  .pendbtn.none { border-color: var(--line); background: var(--paper); color: var(--ink-faint); font-weight: 400; }
  .inboxbtn { border: 1px solid var(--line); background: var(--paper); color: var(--ink);
              border-radius: 999px; padding: 6px 14px; font-size: 12.5px; }
  .inboxbtn .count { font-weight: 600; color: var(--accent); }
  .autochk { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-dim);
             background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .autochk input { margin: 0; cursor: pointer; }

  /* ---------- main surface ---------- */
  .surface { display: grid; grid-template-columns: minmax(0, 1fr) 470px; gap: 16px; align-items: start; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; }
  .card > h3 { padding: 11px 15px; border-bottom: 1px solid var(--line); font-size: 12px;
               text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); display: flex; gap: 10px; align-items: center; }
  .card > h3 .spacer { flex: 1; }

  .mapscroll { position: relative; height: 640px; overflow: auto; cursor: grab; }
  .mapscroll.grabbing { cursor: grabbing; }
  .mapcanvas { position: relative; }
  .mapcanvas svg { position: absolute; left: 0; top: 0; }
  .mnode {
    position: absolute; width: 118px; padding: 8px; border-radius: 9px; font-size: 11.5px;
    line-height: 1.35; border: 1px solid var(--line); background: var(--paper); text-align: left;
  }
  .mnode .mid { font: 600 9.5px ui-monospace, Menlo, monospace; color: var(--ink-faint); letter-spacing: .05em; }
  /* U11: the badges are the click target, so they are a real click target. */
  .mnode .badges { position: absolute; top: -11px; right: -9px; display: flex; gap: 3px; }
  .badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 999px; font-size: 13px; line-height: 1;
    background: var(--paper); border: 1px solid var(--line); box-shadow: 0 1px 3px rgba(15,23,42,.14);
    padding: 0; color: var(--ink); cursor: pointer;
  }
  .badge:hover { transform: scale(1.12); }
  .badge.b-mail { border-color: var(--settled-line); background: var(--settled-bg); }
  .badge.b-alert { border-color: var(--conflict-line); background: var(--conflict-bg); }
  .badge.b-pending { border-color: var(--pend-line); background: var(--pend-bg); }
  .badge.b-conflict { border-color: var(--conflict-ink); background: var(--conflict-bg); }
  .badge.b-mandate { border-color: var(--mandate-line); background: var(--mandate-bg); width: 27px; height: 27px; font-size: 15px; }
  .badge.b-thread { border-color: var(--line); }
  .mnode.settled { background: var(--settled-bg); border-color: var(--settled-line); }
  .mnode.open    { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
  .mnode.stale, .mnode.stale-blocked { background: var(--stale-bg); border-color: var(--stale-line); }
  .mnode.blocked { background: var(--blocked-bg); border-style: dashed; color: var(--ink-faint); }
  .mnode.fogged  { background: #f1f5f9; border-style: dashed; border-color: #cbd5e1; color: #b6c2d1; font-style: italic; }
  .mnode.conflicted { background: var(--conflict-bg); border-color: var(--conflict-ink); border-width: 2px; font-weight: 600; }
  /* R8: quiet dimming downstream — no red, just "waiting on D#". */
  .mnode.conflict-blocked { background: var(--paper); border-style: dashed; border-color: var(--line); color: var(--ink-faint); opacity: .68; }
  .mnode.conflict-blocked .waitfor { display: block; font: 600 9px ui-monospace, Menlo, monospace; color: var(--ink-faint); }
  .mnode.reassessing { background: #f5f3ff; border-color: #c4b5fd; border-style: dashed; }
  .mnode.awaiting-thread { background: var(--mandate-bg); border-color: var(--mandate-line); }
  .mnode.invalidated { background: #f8fafc; border-style: dotted; color: var(--ink-faint); opacity: .72; }
  /* U17: a mandated decision is unmistakable on the map. */
  .mnode.mandated { border-width: 3px; border-color: var(--mandate-line); background: var(--mandate-bg); }
  .mnode.pendlocked { box-shadow: 0 0 0 3px rgba(147,197,253,.55); }
  .mnode.focused { outline: 2px solid var(--accent); outline-offset: 2px; }
  .fogbank { position: absolute; top: 0; bottom: 0; pointer-events: none;
    background: linear-gradient(to right, rgba(248,250,252,0) 0%, rgba(226,232,240,.75) 45%, rgba(203,213,225,.92) 100%); }
  .foglabel { position: absolute; top: 10px; font: 600 10px ui-monospace, Menlo, monospace;
              letter-spacing: .14em; text-transform: uppercase; color: #94a3b8; }
  .hovercard {
    position: fixed; z-index: 950; max-width: 320px; pointer-events: none;
    background: #0f172a; color: #fff; border-radius: 9px; padding: 9px 12px; font-size: 12px; line-height: 1.5;
    box-shadow: 0 10px 30px rgba(15,23,42,.3);
  }
  .hovercard .hid { font: 600 10px ui-monospace, Menlo, monospace; opacity: .6; letter-spacing: .08em; }
  .hovercard .att { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.18); }
  .hovercard .att div { opacity: .92; }
  .hovercard .pcr { margin-top: 5px; }
  .hovercard .pcr b { display: inline-block; min-width: 74px; opacity: .55; font-weight: 600;
                      font-size: 10px; text-transform: uppercase; letter-spacing: .07em; }
  .maplegend { display: flex; gap: 13px; flex-wrap: wrap; padding: 9px 15px; border-top: 1px solid var(--line);
               font-size: 11.5px; color: var(--ink-dim); }
  .maplegend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; }
  .lg-settled::before { background: #86efac; } .lg-open::before { background: var(--accent); }
  .lg-blocked::before { background: #e2e8f0; } .lg-stale::before { background: #fcd34d; }
  .lg-fogged::before { background: #cbd5e1; } .lg-conflict::before { background: #fca5a5; }
  .lg-reassess::before { background: #c4b5fd; }

  /* ---------- the one blended column ---------- */
  /* No scroll-behavior here: it would turn every render's scroll-restore into an
     animation that fights the previous one. Intentional scrolls opt in per call. */
  .column { position: relative; height: 640px; overflow-y: auto; }
  .item { border-bottom: 1px solid var(--line); padding: 12px 15px; transition: padding .2s ease; }
  .item:last-child { border-bottom: 0; }
  .item.focused { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .item.collapsed { padding: 9px 15px; }
  /* U17: and unmistakable in the column. */
  .item.mandated { background: var(--mandate-bg); box-shadow: inset 5px 0 0 var(--mandate-line); }
  .item.mandated.focused { background: #cffafe; }
  .item .head { display: flex; align-items: baseline; gap: 8px; }
  .item .head .t { font-weight: 600; font-size: 13.5px; }
  .item .head .bigmark { font-size: 22px; line-height: 1; align-self: center; }
  .item.collapsed .oneline { font-size: 12.5px; color: var(--ink-dim); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .icons { margin-left: auto; display: flex; gap: 4px; align-items: center; }
  .icons button { border: 1px solid transparent; background: transparent; padding: 3px 6px; font-size: 14px; border-radius: 6px; }
  .icons button:hover { background: var(--page); border-color: var(--line); }
  .mandate-notice { background: var(--mandate-bg); border: 2px solid var(--mandate-line); border-radius: 8px; padding: 11px 13px;
                    font-size: 13px; color: var(--mandate-ink); margin: 8px 0; display: flex; gap: 11px; align-items: flex-start; }
  .mandate-notice .big { font-size: 26px; line-height: 1; }
  .conflict-notice { background: var(--conflict-bg); border: 1px solid var(--conflict-line); border-radius: 8px;
                     padding: 9px 11px; font-size: 12.5px; color: var(--conflict-ink); margin: 8px 0; }
  /* U8: a node carrying an unapplied change says so, and cannot be decided. */
  .pend-notice { background: var(--pend-bg); border: 1px solid var(--pend-line); border-radius: 8px;
                 padding: 9px 11px; font-size: 12.5px; color: var(--pend-ink); margin: 8px 0; }
  /* U15: blocking elicitation threads render at the top of the block. */
  .blocking { background: var(--conflict-bg); border: 1px solid var(--conflict-line); border-radius: 8px;
              padding: 9px 11px; font-size: 12.5px; color: var(--conflict-ink); margin: 8px 0; }
  .blocking .tag { font: 600 9.5px ui-monospace, Menlo, monospace; letter-spacing: .09em; text-transform: uppercase; display: block; margin-bottom: 3px; }
  /* U10: unread information is readable on the collapsed block. */
  .infonote { background: var(--settled-bg); border: 1px solid var(--settled-line); border-radius: 8px;
              padding: 9px 11px; font-size: 12.5px; color: #14532d; margin-top: 7px; }
  .hist { background: var(--page); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; margin-top: 9px; }
  .hist div { font-size: 12px; color: var(--ink-dim); padding: 2px 0; }
  .hist .s { font: 600 10px ui-monospace, Menlo, monospace; color: var(--ink-faint); margin-right: 6px; }
  .quiet-wait { color: var(--ink-faint); font-size: 12.5px; margin-top: 5px; }

  /* ---------- slide-outs ---------- */
  .slide {
    position: fixed; right: 0; top: 0; bottom: 0; width: 500px; background: var(--paper); z-index: 800;
    border-left: 1px solid var(--line); box-shadow: -14px 0 44px rgba(15,23,42,.15); overflow-y: auto; padding: 20px 22px 40px;
  }
  /* U18: threads open on the LEFT so they never cover the decision under discussion. */
  .slide.left { left: 0; right: auto; border-left: 0; border-right: 1px solid var(--line);
                box-shadow: 14px 0 44px rgba(15,23,42,.15); width: 520px; }
  .slide .close { position: absolute; right: 14px; top: 14px; border: 0; background: transparent; font-size: 18px; color: var(--ink-faint); }
  .slide .popout { position: absolute; right: 44px; top: 15px; border: 1px solid var(--line); background: var(--paper);
                   border-radius: 7px; font-size: 12px; padding: 3px 8px; color: var(--ink-dim); }
  .turn { margin-bottom: 12px; }
  .turn .who { font: 600 10.5px ui-monospace, Menlo, monospace; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); }
  .turn.agent .who { color: var(--accent); }
  .turn p { margin: 3px 0 0; font-size: 13.2px; color: var(--ink); }
  /* T4: mid-thread the agent may put a real option set in front of you. */
  .ask { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; margin-top: 8px; background: var(--page); }
  .ask .rec-line { margin-bottom: 5px; }
  .seeds { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
  .thread-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); align-items: center; }
  .parked-note { background: var(--page); border: 1px dashed var(--line); border-radius: 8px; padding: 9px 12px; font-size: 12.5px; color: var(--ink-dim); margin-top: 10px; }
  .disruptive { background: #fff7ed; border: 1px solid #fdba74; color: #9a3412; border-radius: 8px; padding: 9px 12px; font-size: 12.5px; margin-top: 10px; }
  /* T1: fold-readiness is a property of the thread; the impact hides behind this. */
  details.foldimpact { display: inline-block; }
  details.foldimpact summary { cursor: pointer; font-size: 12px; color: var(--accent); }
  details.foldimpact .body { font-size: 12.5px; color: var(--ink-dim); margin-top: 6px; max-width: 44ch; }

  .inbox-item { border-bottom: 1px solid var(--line); padding: 11px 4px; display: flex; gap: 10px; align-items: flex-start; }
  .inbox-item:last-child { border-bottom: 0; }
  .inbox-item.unread { background: #fcfdff; }
  .inbox-item .txt { flex: 1; font-size: 13px; }
  .inbox-item .type { font: 600 9.5px ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .t-pending-update { color: var(--pend-ink); } .t-informational { color: var(--settled-ink); }
  .t-elicitative { color: var(--conflict-ink); } .t-suggested-thread { color: var(--stale-ink); }
  .t-applied-change { color: var(--accent); } .t-conflict { color: var(--conflict-ink); }
  .unreadmark { color: var(--accent); font-weight: 700; }
  .filterbar { display: flex; gap: 6px; margin: 4px 0 12px; }
  .filterbar button { border: 1px solid var(--line); background: var(--paper); color: var(--ink-dim);
                      border-radius: 999px; padding: 4px 11px; font-size: 12px; }
  .filterbar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .banner { border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 12px;
            background: #fff7ed; border: 1px solid #fdba74; color: #9a3412; }
  .pending-list { padding: 4px 0; }
  .pending-row { border-bottom: 1px solid var(--line); padding: 10px 4px; font-size: 13px; }
  .pending-row:last-child { border-bottom: 0; }
  .pending-row .c { color: var(--conflict-ink); font-weight: 600; font-size: 12px; }
  .pending-row .acts { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }

  /* ---------- U7: informational bubbles, upper right ---------- */
  .bubbles { position: fixed; top: 16px; right: 16px; z-index: 990; display: flex; flex-direction: column; gap: 8px; width: 330px; }
  .bubble {
    background: #0f172a; color: #fff; border-radius: 10px; padding: 11px 13px; font-size: 12.5px; line-height: 1.5;
    box-shadow: 0 12px 34px rgba(15,23,42,.28); cursor: pointer; border: 1px solid rgba(255,255,255,.1);
  }
  .bubble .bh { display: flex; gap: 8px; align-items: center; font: 600 9.5px ui-monospace, Menlo, monospace;
                letter-spacing: .09em; text-transform: uppercase; opacity: .65; margin-bottom: 4px; }
  .bubble .bh .spacer { flex: 1; }
  .bubble.queued { opacity: .72; transform: scale(.97); }
  /* The drain is CSS, so it needs no per-frame DOM writes (which used to eat the
     click) and pauses on hover for free. */
  .bubble .bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,.22); margin-top: 8px; overflow: hidden; }
  .bubble .bar i { display: block; height: 100%; background: rgba(255,255,255,.8); border-radius: 2px; width: 100%; }
  .bubble.top .bar i { animation: drain 3s linear forwards; }
  /* Driven by a class, not :hover — removing the hovered bubble leaves :hover
     latched on the container until the next mouse move, which pauses the bubble
     born after it. */
  #bubbles.paused .bubble.top .bar i { animation-play-state: paused; }
  @keyframes drain { from { width: 100%; } to { width: 0%; } }
</style>

<body>
<script>
//---GRILL-MODULE-START---
/* =====================================================================
   Grilling session, round 4 — pure state module.
   No DOM, no network, no globals beyond the exported object.

   The event log is the state. Every action turns into events; the whole
   state is folded from the log, so per-node history and the raw session
   log are the same data read two ways.

   Round 3's behaviour is unchanged. What round 4 adds is a live-agent
   mode: with `setLiveAgent(true)`, saying something in a thread no longer
   manufactures the agent's reply on the spot — the human turn stands
   alone and the reply arrives later as a `thread-turn` update, through
   the same arrival path as every other update. Off (the default), the
   canned replies of round 3 still run, which is what the self-check
   below exercises.
   ===================================================================== */

var PLAN = "Design a nightly autonomous overnight-build pipeline: which tracked work items it may pick up, how it proves completion, and when it must wake the human.";

// options[0] is always the agent's recommended answer.
// pcr = [what it buys, what it costs, what it forces downstream] — the hover overlay.
var NODES = [
  { id: "D1", short: "Work-item source", title: "Where the night's candidate work comes from",
    prereqs: [],
    body: "The run needs a candidate list before it can do anything else. Is that list a snapshot taken at launch, or re-derived as the night goes on?",
    options: [
      { id: "a", text: "A snapshot query against the tracker taken at launch, frozen for the night.",
        pcr: ["One stable list; the night's plan is knowable in advance.", "Work filed at 2am waits until tomorrow night.", "Makes the morning report a closed set."] },
      { id: "b", text: "A live query re-run before every item, so work filed at 2am is picked up.",
        pcr: ["Nothing filed overnight is missed.", "The plan can change under a claim already taken.", "Forces a decision about what a re-query costs."] },
      { id: "c", text: "A hand-curated queue the human fills before going to bed.",
        pcr: ["You control exactly what runs.", "The pipeline only works on nights you prepared for.", "Moves human time back upstream — the point, or the failure."] } ] },

  { id: "D2", short: "Why wake at all", title: "The class of thing that justifies waking the human",
    prereqs: [],
    body: "Waking is the expensive event — the pipeline exists to avoid it. Name what justifies one before deciding how one happens.",
    options: [
      { id: "a", text: "Only decisions the pipeline is not authorised to make. Never for progress, never for a single failure.",
        pcr: ["Wakes are rare and always actionable.", "A stalled night looks like a good one until morning.", "Every failure path now needs a park."] },
      { id: "b", text: "Any blocked item, so the night never idles.",
        pcr: ["Nothing sits idle for hours.", "Four wakes a night is a plausible outcome.", "Forces a precise definition of blocked."] },
      { id: "c", text: "Nothing at all — everything waits until morning.",
        pcr: ["You always sleep.", "A decision needed at 1am is found at 8am.", "The pipeline can never exceed its standing authority."] } ] },

  { id: "D3", short: "Eligibility filter", title: "Which items a fully autonomous run may pick up",
    prereqs: ["D1"],
    body: "Of everything in that source, what qualifies as safe to work unattended?",
    options: [
      { id: "a", text: "Items whose acceptance criteria are already enumerated and that carry a track.",
        pcr: ["The agent has a contract to finish against.", "Excludes most of a real backlog.", "Pushes criteria-writing upstream into human time."] },
      { id: "b", text: "Anything not blocked and not assigned to a human.",
        pcr: ["Large candidate pool, no preparation.", "Underspecified items burn the night going sideways.", "Leaves the proof rule with nothing to check against."] },
      { id: "c", text: "An explicit overnight label — opt-in, per item.",
        pcr: ["Opt-in is unambiguous and auditable.", "Somebody has to remember to label.", "Makes eligibility a human ritual, not a property."] } ] },

  { id: "D4", short: "Claim mechanism", title: "How an item is claimed so two runs cannot collide",
    prereqs: ["D1"],
    body: "Two runs — or a human awake at 1am — must not work the same item. What makes a claim visible?",
    options: [
      { id: "a", text: "A claim record on the tracker item carrying the run id and a timestamp, checked before work starts.",
        pcr: ["Visible to anything that reads the tracker.", "Needs a release path for when a run dies.", "Introduces the stale-claim question."] },
      { id: "b", text: "A lock file committed to the repository.",
        pcr: ["Lives with the code, no tracker dependency.", "A commit is a poor lock and conflicts on its own.", "Every claim becomes a repository write."] },
      { id: "c", text: "No claim; the scheduler guarantees one run at a time.",
        pcr: ["Nothing to build.", "One overlapping run corrupts both.", "Bets the whole design on the scheduler."] } ] },

  { id: "D5", short: "Proof of completion", title: "What counts as proof an item is actually done",
    prereqs: ["D3"],
    body: "The pipeline may only mark an item complete on evidence. Evidence of what, exactly?",
    options: [
      { id: "a", text: "A green whole-repo gate on the item's branch, plus every acceptance criterion mapped to a named passing test.",
        pcr: ["Every criterion has a named witness.", "Slow, and only ever as good as the tests.", "Six decisions downstream read this as their premise."] },
      { id: "b", text: "A green whole-repo gate. Nothing further.",
        pcr: ["Cheap and unambiguous.", "A suite that asserts nothing still passes.", "Shifts all real verification onto review."] },
      { id: "c", text: "A green gate plus the implementing agent's own written completion verdict.",
        pcr: ["Captures reasoning a test cannot.", "The author grading its own work.", "Invites a fresh-context reviewer instead."] } ],
    talk: {
      why: "Because every other decision on this board resolves to it. The eligibility filter decides what may be started; this decides what may be called finished — and an autonomous night is exactly the situation where nobody is standing behind the claim.",
      zoom: "One level up, the pipeline is a machine for converting your sleep into merged work. That trade only pays if the completion claim is worth more than the review time it saves. Everything about the gate's membership, its runtime budget and what lands is downstream of the standard you set here." } },

  { id: "D6", short: "Wake channel", title: "How the human is physically woken",
    prereqs: ["D2"],
    body: "Given a wake is justified, what happens at 3am?",
    options: [
      { id: "a", text: "A push notification carrying the item and the question in the body.",
        pcr: ["Fast, and carries the question itself.", "A silenced phone swallows it.", "The wake is only as good as the phone's settings."] },
      { id: "b", text: "A queued message read at breakfast — no interrupt, ever.",
        pcr: ["Sleep is never interrupted.", "A 1am decision waits seven hours.", "Makes the wake threshold nearly moot."] },
      { id: "c", text: "Escalating: notification first, phone call after fifteen minutes.",
        pcr: ["Reaches you when it truly matters.", "A false positive at 3am is expensive.", "Answers the accumulation question on its own."] } ] },

  { id: "D7", short: "Gate membership", title: "Which checks constitute the gate overnight",
    prereqs: ["D5"],
    body: "'Green gate' names a set of checks. Is that set the same one a human runs by hand?",
    options: [
      { id: "a", text: "Identical to the gate humans run. No overnight-only subset, no overnight-only additions.",
        pcr: ["Night output is the same artifact class as day output.", "You pay the full runtime on every item.", "Forces a per-item runtime budget."] },
      { id: "b", text: "A fast subset overnight, the full gate replayed in the morning.",
        pcr: ["More items per night.", "Morning replay can red something reported green.", "Creates a second-class result needing re-proof."] },
      { id: "c", text: "The full gate plus a mutation-testing pass, since nobody is watching.",
        pcr: ["Catches assertion-free tests directly.", "A mutation run can dwarf the night.", "May spend the entire budget on one item."] } ],
    talk: {
      why: "Because a gate that differs overnight makes every overnight result unreproducible by hand in the morning — you would be debugging the gate, not the work.",
      zoom: "The membership question only looks local. It is really asking whether the night's output is the same artifact class as the day's, or a second-class one that needs re-proving before anyone trusts it." } },

  { id: "D8", short: "Failed proof", title: "What happens to an item whose proof fails",
    prereqs: ["D5"],
    body: "The gate goes red at 2am. Decide the fate of that item, and of the rest of the night.",
    options: [
      { id: "a", text: "Park the item with the failing output attached, move to the next eligible item, do not wake.",
        pcr: ["The night continues and the evidence is kept.", "Failures accumulate silently.", "Makes the wake threshold the real control."] },
      { id: "b", text: "Retry the item once from scratch, then park it.",
        pcr: ["Absorbs transient failures cheaply.", "Hides the flakiness you would want filed.", "Overlaps with the flaky-check decision."] },
      { id: "c", text: "Stop the night entirely and wake the human.",
        pcr: ["Nothing compounds on a broken base.", "One bad item costs the whole night.", "Contradicts a narrow wake policy."] } ] },

  { id: "D9", short: "Stale claims", title: "How a claim held by a crashed run is released",
    prereqs: ["D4"],
    body: "A run dies holding claims. Nothing releases them. What breaks the deadlock without stealing live work?",
    options: [
      { id: "a", text: "Claims carry a TTL and are reclaimable once the owning run's process is provably gone.",
        pcr: ["Never steals live work.", "Needs a liveness check you can trust.", "Claims must carry real evidence, not just a pid."] },
      { id: "b", text: "Claims expire on a fixed four-hour timer regardless of the owner.",
        pcr: ["Trivial to implement.", "A slow item loses its claim mid-flight.", "Long items become impossible."] },
      { id: "c", text: "A human clears them in the morning.",
        pcr: ["No mechanism to get wrong.", "The deadlock survives until morning.", "Adds a manual step to every crash."] } ] },

  { id: "D10", short: "Wake threshold", title: "When accumulated failure justifies a wake",
    prereqs: ["D6", "D8"],
    body: "Failures are parked rather than escalated. Is there a count at which the accumulation itself is the decision the pipeline cannot make?",
    options: [
      { id: "a", text: "Never on failure count. Wake only when zero eligible items remain and hours of night are left.",
        pcr: ["Failure counts never wake you.", "A night that parks everything still runs on.", "Turns wake into an idle-capacity signal."] },
      { id: "b", text: "After three consecutive parked items.",
        pcr: ["Catches a systemic break early.", "Three unrelated failures are not a pattern.", "Requires classifying failures."] },
      { id: "c", text: "The first time an item parks.",
        pcr: ["You always know immediately.", "Nearly guarantees a wake every night.", "Collapses into a stop-and-wake policy."] } ] },

  { id: "D11", short: "What lands", title: "What the pipeline does with proven work",
    prereqs: ["D7"],
    body: "The gate is green and each criterion maps to a passing test. Where does the branch go?",
    options: [
      { id: "a", text: "Push the branch and open a pull request. The branch is the artifact; the merge is a separate decision.",
        pcr: ["Reviewable, and the merge stays a decision.", "Pull requests pile up for the morning.", "Makes merge authority its own question."] },
      { id: "b", text: "Merge to the default branch directly.",
        pcr: ["Work is live at breakfast.", "Unreviewed change on the trunk.", "Demands a rollback path."] },
      { id: "c", text: "Leave the branch local and name it in the morning report.",
        pcr: ["Nothing leaves the machine.", "Invisible to everyone else, lost with the box.", "The morning report becomes the only index."] } ] },

  { id: "D12", short: "Merge authority", title: "Whether the pipeline may merge unattended",
    prereqs: ["D11"],
    body: "May it merge its own pull request while the human sleeps?",
    options: [
      { id: "a", text: "No. Opening a pull request is not authorisation to merge; the merge waits for an explicit human instruction.",
        pcr: ["Authority stays where a human owns it.", "Nothing lands while you sleep.", "Morning starts with a merge queue."] },
      { id: "b", text: "Yes, when the gate is green and a reviewer has approved.",
        pcr: ["Mirrors the daytime rule exactly.", "An agent's approval is not a human's.", "Makes reviewer identity load-bearing."] },
      { id: "c", text: "Yes, but only on one named low-risk track.",
        pcr: ["Bounded blast radius, real throughput.", "Track boundaries drift over time.", "Someone must police what enters that track."] } ],
    mandate: {
      threadId: "T-auth", scope: "any",
      title: "Where does merge authority actually come from?",
      notice: "ANY answer here opens a side thread, and concluding that thread is the only way to settle this decision. Authority is the one thing the agent will not let you assert in one click. You choose first, then the thread opens on what you chose." },
    talk: {
      why: "Because this is the only decision on the board that grants the pipeline power over the trunk. Every other wrong answer costs a night; this one costs the repository.",
      zoom: "Zooming out: merge authority is not a pipeline setting, it is a policy that has to exist in writing somewhere a human owns. The question is which written thing the pipeline is allowed to read as permission." } },

  { id: "D13", short: "Flaky checks", title: "How a nondeterministic gate failure is handled",
    prereqs: ["D7", "D8"],
    body: "A check fails in a way that passes on re-run. Retrying hides real bugs; refusing to retry parks good work.",
    options: [
      { id: "a", text: "Re-run the failing check exactly once. A pass on retry still parks the item, and files the flake.",
        pcr: ["Separates flaky from broken without trusting either.", "Good work still parks.", "Builds a flake record over time."] },
      { id: "b", text: "Retry up to three times and proceed on any pass.",
        pcr: ["Highest throughput.", "Hides a real intermittent bug as noise.", "Quietly undermines the proof rule."] },
      { id: "c", text: "No retries. A red check is red.",
        pcr: ["A red check means exactly one thing.", "Flakes cost whole items.", "Pressure moves onto fixing flakes, eventually."] } ] },

  { id: "D14", short: "Budget exhaustion", title: "What happens when the night's budget runs out mid-item",
    prereqs: ["D10"],
    body: "Token and wall-clock budget are finite. The budget expires halfway through an item.",
    options: [
      { id: "a", text: "Finish the current item's gate run, then stop cleanly and release claims. Never start an item you cannot finish.",
        pcr: ["No half-landed work; claims released cleanly.", "Needs a per-item cost estimate to schedule.", "Ties directly to the gate runtime budget."] },
      { id: "b", text: "Hard stop immediately; claims expire by TTL.",
        pcr: ["The budget is respected exactly.", "Leaves an item mid-flight holding a claim.", "Puts all recovery on the TTL."] },
      { id: "c", text: "No budget — run until morning.",
        pcr: ["Nothing is ever cut short.", "A runaway item eats the night and the tokens.", "Removes the only cost control."] } ] },

  { id: "D15", short: "Blast radius", title: "The recovery path when a night's work turns out wrong",
    prereqs: ["D12"], fogUntil: "D12",
    fogTitle: "something about what happens after the work lands",
    body: "The landing rule is now fixed, so the question of undoing a landing is finally askable. What is the recovery path?",
    options: [
      { id: "a", text: "One pull request per item, so a revert is per-item and needs no coordination.",
        pcr: ["Revert is per-item and needs no coordination.", "More pull requests to shepherd.", "Keeps the blast radius one item wide."] },
      { id: "b", text: "A nightly tag to roll the whole night back to.",
        pcr: ["One handle rolls back everything.", "Undoes the good work with the bad.", "Encourages all-or-nothing nights."] },
      { id: "c", text: "Nothing — review catches it before anything is merged.",
        pcr: ["No machinery at all.", "Assumes review never misses.", "Recovery becomes an unplanned emergency."] } ] },

  { id: "D16", short: "Gate runtime budget", title: "How much of the night one item's proof may consume",
    prereqs: ["D7"], fogUntil: "D7",
    fogTitle: "something about how long the proof takes",
    body: "The gate is now a known set of checks with a known runtime, so its cost per item is finally a decidable question.",
    options: [
      { id: "a", text: "A twenty-minute per-item gate budget; exceeding it parks the item as unprovable rather than unproven.",
        pcr: ["One item can never eat the night.", "Slow but legitimate proofs get parked.", "Distinguishes unprovable from unproven."] },
      { id: "b", text: "No limit. Correctness beats throughput and the night is long.",
        pcr: ["Correctness is never traded away.", "One pathological item ends the night.", "Throughput becomes unpredictable."] },
      { id: "c", text: "Kill at ten minutes and retry once in a quieter slot.",
        pcr: ["Cheap first attempt, second chance later.", "Two partial runs can cost more than one full one.", "Needs a notion of a quieter slot."] } ] }
];

// Decisions the agent can materialise mid-session (elicitative responses).
var LATER = {
  D17: { id: "D17", short: "Re-query cost", title: "What a mid-run re-query costs, and when it runs",
    prereqs: ["D1"],
    body: "You chose a live query. Re-deriving the candidate list before every item is not free, and it can change the night's plan underneath a claim already taken.",
    options: [
      { id: "a", text: "Re-query only between items, never mid-item, and cap it at one query per item.",
        pcr: ["Never changes the plan mid-item.", "Work filed mid-item waits for the boundary.", "Claims stay valid for an item's lifetime."] },
      { id: "b", text: "Re-query on a five-minute timer regardless of item boundaries.",
        pcr: ["The freshest possible list.", "Can invalidate a claim already taken.", "Forces claim revalidation."] },
      { id: "c", text: "Re-query only when the current item finishes early.",
        pcr: ["Costs nothing on a busy night.", "Busy nights never see new work.", "Makes re-query a rare, easily untested path."] } ] },
  D18: { id: "D18", short: "What 'blocked' means", title: "What counts as blocked, given a blocked item wakes you",
    prereqs: ["D2"],
    body: "You said any blocked item justifies a wake. The tracker's notion of blocked and yours are not obviously the same thing, and the difference is the difference between one wake a week and four a night.",
    options: [
      { id: "a", text: "Only an explicit blocked-by edge to an unfinished item counts. A failing gate is not blocked.",
        pcr: ["Precise, and the tracker already models it.", "Misses real blockers nobody filed.", "Failing gates route to park, not to a wake."] },
      { id: "b", text: "Anything the run could not finish for any reason.",
        pcr: ["Nothing is silently dropped.", "Every failure becomes a wake.", "Collapses into wake-on-first-failure."] },
      { id: "c", text: "Blocked is whatever the tracker's own status field says.",
        pcr: ["One source of truth, no new vocabulary.", "Inherits whatever the tracker means today.", "Couples wake policy to tracker configuration."] } ] }
};

var GENERIC_PCR = ["Keeps the agent's reasoning and yours in one answer.",
  "Longer to state, and harder to check later.", "Downstream decisions read the whole clause, not the headline."];

function clone(x) { return JSON.parse(JSON.stringify(x)); }
function baseNode(id) { return NODES.filter(function (n) { return n.id === id; })[0] || LATER[id]; }

/* ---------------- projection: state is a fold of the log ---------------- */

function project(events) {
  var s = {
    events: events, nodes: {}, order: [], threads: {}, threadOrder: [],
    mailbox: [], conflicts: {}, notes: [], read: {}, recommendNext: null,
    autoApply: true, banner: null, touched: [], fresh: [], seq: events.length, plan: PLAN
  };
  NODES.forEach(function (n) {
    s.nodes[n.id] = clone(n);
    s.nodes[n.id].answer = null; s.nodes[n.id].stale = false;
    s.nodes[n.id].provisional = null; s.nodes[n.id].invalidated = false;
    s.nodes[n.id].pendingAnswer = null; s.nodes[n.id].info = null;
    s.order.push(n.id);
  });
  events.forEach(function (e) { applyEvent(s, e); });
  return s;
}

function addNode(s, id) {
  if (s.nodes[id]) return;
  var n = clone(baseNode(id));
  n.answer = null; n.stale = false; n.provisional = null; n.invalidated = false;
  n.pendingAnswer = null; n.info = null;
  s.nodes[id] = n; s.order.push(id);
}

function putThread(s, t) {
  s.threads[t.id] = t;
  if (s.threadOrder.indexOf(t.id) < 0) s.threadOrder.push(t.id);
}
function note(s, n) { s.notes.push(n); }

function applyEvent(s, e) {
  var n = e.nodeId ? s.nodes[e.nodeId] : null;
  switch (e.kind) {
    case "auto-pref":
      s.autoApply = e.on;
      break;
    case "answer":
      if (!n) break;
      n.answer = e.answer; n.stale = false; n.provisional = null; n.pendingAnswer = null;
      s.touched = [e.nodeId];
      break;
    case "answer-held":
      if (n) n.pendingAnswer = e.answer;
      break;
    // R10: abandoning a mandated thread's answer reverts the selection.
    case "answer-abandoned":
      if (n) { n.pendingAnswer = null; s.touched = [e.nodeId]; }
      break;
    case "provisional":
      e.nodeIds.forEach(function (id) { if (s.nodes[id]) s.nodes[id].provisional = e.because; });
      s.touched = e.nodeIds.slice();
      break;
    case "queued":
      s.mailbox.push({ u: e.update, status: "queued", at: e.seq });
      break;
    case "applied": {
      var m = mailboxEntry(s, e.updateId);
      if (m) m.status = "applied";
      applyUpdate(s, e.update);
      // U4: a notification exists only for a change that has actually landed.
      note(s, noteFor(e.update, e.auto));
      break;
    }
    // U5: a pending change can be talked out of existence in its own thread.
    case "dismissed": {
      var md = mailboxEntry(s, e.updateId);
      if (md) md.status = "dismissed";
      s.touched = [e.nodeId];
      break;
    }
    case "conflict-raised": {
      var mc = mailboxEntry(s, e.updateId);
      if (mc) mc.status = "conflict";
      s.conflicts[e.nodeId] = { updateId: e.updateId, threadId: e.threadId };
      putThread(s, {
        id: e.threadId, anchor: e.nodeId, kind: "conflict", status: "open", requiresAction: true,
        title: "Conflict on " + e.nodeId + " — your answer and the agent's update disagree",
        turns: e.turns, updateId: e.updateId
      });
      note(s, { id: "n-" + e.threadId, type: "conflict", nodeId: e.nodeId,
        text: "Conflict on " + e.nodeId + " — the update predates your change and needs judging.",
        action: "conflict" });
      s.touched = [e.nodeId];
      break;
    }

  assert.strictEqual(statusOf(E, "D16"), "open", "D16 defogs once D7 settles");
  assert.ok(E.threads["T-proof"], "U9: the elicitative alert applied itself rather than hiding in the inbox");
  assert.strictEqual(blockLock(E, "D7").kind, "elicitation", "U15: D7 is locked while it is unanswered");
  assert.deepStrictEqual(pick(E, "D7", "b"), E, "so its options cannot be changed around it");
  var Ed = reduce(E, { type: "dismissThread", id: "T-proof" });
  assert.strictEqual(blockLock(Ed, "D7"), null, "closing it releases the block");
  // 6. the disruptive fold is synchronous — it does not wait in the inbox
  var F = reduce(reduce(E, { type: "openThread", id: "T-proof" }), { type: "foldThread", id: "T-proof" });
  assert.strictEqual(pending(F).length, 0, "nothing was queued");
  assert.ok(/fresh-context reviewer/.test(answerText(F, "D5")), "the disruptive fold rewrote D5 immediately");
  assert.ok(F.banner, "and said so");
  assert.strictEqual(statusOf(F, "D7"), "stale", "D7 came back to the frontier");

  // 7. conflict: an update lands on a node the user changed after it was generated
  var c = pick(q, "D2", "a");
  var c0 = c; c = pick(c, "D3", "a");
  var cPlan = agentPlan(c, tail(c, c0));                  // generated now…
  c = pick(c, "D5", "a");                                 // …user gets there first
  c = pick(c, "D7", "a");
  c = deliver(c, cPlan);                                  // …and it arrives late
  assert.strictEqual(pending(c).length, 1, "a conflicting update never applies itself");
  assert.ok(pending(c)[0].conflicts, "and is flagged as conflicting in the inbox");
  var cc = reduce(c, { type: "applyPending" });
  assert.strictEqual(statusOf(cc, "D5"), "conflicted", "D5 is conflicted, not silently overwritten");
  assert.strictEqual(statusOf(cc, "D7"), "conflict-blocked", "an ALREADY-ANSWERED downstream decision is blocked");
  assert.strictEqual(nodeView(cc, "D7").waitingOn, "D5", "R8: and it says which node it is waiting on");
  assert.ok(cc.threads["C-" + cc.conflicts.D5.updateId], "the conflict opened its own thread");
  assert.strictEqual(cc.threads["C-" + cc.conflicts.D5.updateId].turns[0].who, "human", "seeded with an auto-drafted first message");
  assert.deepStrictEqual(reduce(cc, { type: "answer", id: "D7", payload: { optionId: "b" } }), cc, "conflict-blocked cannot be answered");
  var cPark = reduce(cc, { type: "parkThread", id: "C-" + cc.conflicts.D5.updateId });
  assert.strictEqual(statusOf(cPark, "D5"), "settled", "parking resolves it in the user's favour");
  assert.strictEqual(statusOf(cPark, "D7"), "settled", "and downstream unblocks");
  var cFold = reduce(cc, { type: "foldThread", id: "C-" + cc.conflicts.D5.updateId });
  assert.strictEqual(cFold.nodes.D5.options[0].id, "d", "folding applies the agent's revision instead");

  // 8. R9 — staleness is provisional until the agent adjudicates it
  var r0 = cPark, r = pick(r0, "D3", "c");
  assert.strictEqual(statusOf(r, "D5"), "reassessing", "descendants are provisional, not stale");
  assert.ok(frontier(r).indexOf("D5") < 0, "a reassessing node is not answerable yet");
  r = deliver(r, agentPlan(r, tail(r, r0)));
  assert.strictEqual(statusOf(r, "D5"), "stale", "the agent confirmed the direct dependent on arrival");
  assert.strictEqual(statusOf(r, "D7"), "settled", "and cleared the deeper one");
  assert.strictEqual(blockLock(r, "D5").kind, "pending", "…while its revised options wait in the inbox");
  r = reduce(r, { type: "applyPending" });
  assert.ok(frontier(r).indexOf("D5") >= 0, "applying them puts D5 back on the frontier");

  // 9. U19 — opening a thread panel and saying nothing creates no thread
  assert.deepStrictEqual(reduce(g, { type: "newThread", id: "D5" }), g, "an empty thread is not a thread");
  assert.strictEqual(threadsOf(reduce(g, { type: "newThread", id: "D5" }), "D5").length, 0);
  var t = reduce(g, { type: "newThread", id: "D5", seed: "tradeoffs" });
  assert.strictEqual(threadsOf(t, "D5").length, 1, "the first thing said is what creates it");
  var tid = t.threadOrder[t.threadOrder.length - 1];
  assert.ok(/D5 —/.test(t.threads[tid].title), "T5: and it titles itself");

  // 10. park, reopen, fold — and a fold impact obeys the same taxonomy
  var nodesBeforePark = JSON.stringify(t.nodes);
  t = reduce(t, { type: "parkThread", id: tid });
  assert.strictEqual(t.threads[tid].status, "parked");
  assert.strictEqual(JSON.stringify(t.nodes), nodesBeforePark, "a parked thread changes no decision");
  t = reduce(t, { type: "openThread", id: tid });
  assert.ok(foldReady(t.threads[tid]), "T1: the thread is fold-ready because a response declared an impact");
  var beforeFold = JSON.stringify(t.nodes);
  t = reduce(t, { type: "foldThread", id: tid });
  assert.strictEqual(t.threads[tid].status, "folded");
  assert.strictEqual(JSON.stringify(t.nodes), beforeFold, "its impact revises an ANSWERED node, so it waits");
  assert.strictEqual(pending(t).length, 1);
  t = reduce(t, { type: "applyPending" });
  assert.strictEqual(t.nodes.D5.options[0].id, "d", "and lands only when applied");
  assert.strictEqual(threadsOf(reduce(t, { type: "relitigate", id: tid }), "D5").length, 2, "a node carries multiple threads");

  // 11. T4/T5 — free text titles the thread and draws a real option set out of the agent
  var ft = reduce(g, { type: "newThread", id: "D5", text: "I care more about catching a lying test than about speed." });
  var ftid = ft.threadOrder[ft.threadOrder.length - 1];
  assert.ok(/lying test/.test(ft.threads[ftid].title), "T5: titled from what was said");
  assert.ok(ft.threads[ftid].turns[1].ask, "T4: the agent answers with options, not just prose");
  assert.ok(!foldReady(ft.threads[ftid]), "and declares nothing foldable yet");
  ft = reduce(ft, { type: "threadSay", id: ftid, text: "Fold it in as a constraint." });
  assert.ok(foldReady(ft.threads[ftid]), "T1: fold-readiness arrives with the agent's response");

  // 12. per-node history reads without reopening anything, and the log is one list
  assert.ok(historyOf(t, "D5").length >= 3, "D5 carries its own change history");
  assert.ok(t.events.length > historyOf(t, "D5").length, "history is a view of the one session log");

  // 13. round 4 — a real agent on a wire speaks through updates, not through
  //     the reducer, and what it says in a thread arrives like anything else.
  var lv = reduce(g, { type: "newThread", id: "D5", text: "Does the gate notice a test that asserts nothing?" });
  var lvid = lv.threadOrder[lv.threadOrder.length - 1];
  assert.strictEqual(lv.threads[lvid].turns.length, 2, "canned mode still answers on the spot");
  setLiveAgent(true);
  var lw = reduce(g, { type: "newThread", id: "D5", text: "Does the gate notice a test that asserts nothing?" });
  var lwid = lw.threadOrder[lw.threadOrder.length - 1];
  assert.strictEqual(lw.threads[lwid].turns.length, 1, "live mode puts no words in the agent's mouth");
  assert.strictEqual(lw.threads[lwid].turns[0].who, "human");
  assert.strictEqual(reduce(lw, { type: "threadSay", id: lwid, text: "Well?" }).threads[lwid].turns.length, 2,
    "and a second thing said adds one turn, not two");
  var reply = { kind: "thread-turn", id: "W1-t", nodeId: "D5", threadId: lwid, basedOnSeq: lw.seq,
    summary: "The agent replied in the thread on D5.",
    turns: [{ who: "agent", text: "It does not. That is a proof about the suite, not about the work.",
      impact: { summary: "Adds a fresh-context reviewer to the proof rule.", detail: "D5 gains a clause.",
        updates: [{ kind: "revise", nodeId: "D5", summary: "D5 revised by the thread.", options: lw.nodes.D5.options }] } }] };
  assert.strictEqual(autoApplies(lw, reply), true, "an agent's thread reply never waits — talking is not deciding");
  var lr = reduce(lw, { type: "agentResponse", updates: [reply] });
  assert.strictEqual(lr.threads[lwid].turns.length, 2, "the reply landed in the thread it names");
  assert.strictEqual(lr.threads[lwid].turns[1].who, "agent");
  assert.ok(foldReady(lr.threads[lwid]), "T1: fold-readiness rides in on the wire like any other impact");
  assert.strictEqual(pending(lr).length, 0, "and the reply itself queues nothing");
  assert.strictEqual(reduce(lw, { type: "agentResponse",
    updates: [{ kind: "thread-turn", id: "W2-t", threadId: "no-such-thread", turns: [{ who: "agent", text: "hi" }] }]
  }).threads[lwid].turns.length, 1, "a reply naming a thread that does not exist changes nothing");
  setLiveAgent(false);

  console.log("grilling r4 state module self-check: OK (" + NODES.length + " base decisions, " +
    Object.keys(LATER).length + " agent-addable, " + t.events.length + " events in the last session, " +
    "live-agent thread turns covered)");
}
//---GRILL-MODULE-END---
</script>

<script>
/* =====================================================================
   Page shell. Throwaway. One hybrid surface over the module above:
   a map canvas beside one blended column, threads sliding in from the
   left, the inbox and notifications from the right.
   ===================================================================== */

// Namespaced, because every file:// page shares one localStorage origin.
var LS = {
  get: function (k, d) {
    try { var v = localStorage.getItem("grillproto4." + k); return v === null ? d : JSON.parse(v); }
    catch (e) { return d; }
  },
  set: function (k, v) { try { localStorage.setItem("grillproto4." + k, JSON.stringify(v)); } catch (e) {} },
  clear: function () {
    try {
      Object.keys(localStorage).filter(function (k) { return k.indexOf("grillproto4.") === 0; })
        .forEach(function (k) { localStorage.removeItem(k); });
    } catch (e) {}
  }
};

var S = Grill.initial(LS.get("autoApply", true));
// The agent is on the other end of a wire, so the module must stop writing its
// lines: a thread turn goes out alone and the reply arrives as an update.
Grill.setLiveAgent(true);
var UI = {
  focus: "D1", open: {}, drafts: {}, panel: null,
  lastFocus: null, lastPanelKey: null, centerNext: true, justSettled: null,
  unreadOnly: LS.get("unreadOnly", true),
  bubbles: [], bubbleSeen: {}, bubbleSig: null, bubbleTick: 0, ptr: null,
  popped: {}, draftBase: {}, popFail: false
};

/* ---------- the wire to a server-authoritative backend ----------
   Round 4 had a mail slot and a page that owned the board; an agent watched
   the deltas and rebuilt the state itself. Round 5 inverts that. backend.py
   owns an append-only log on disk, stamps the ONE authoritative seq, mints its
   own agents, and hands this page a snapshot on request. This page is a viewer.

   Three consequences, and they are the whole diff below:
     - the page no longer publishes a hello carrying "the board". It ASKS for
       the board. A reconnect can no longer be mistaken for a reset (W1).
     - every post carries the server's epoch and a per-event idempotency key,
       so a double-send is deduped by the server rather than by nobody (W3/W7).
     - every post comes back with a receipt per event, rejections included, so
       "accepted" stops meaning "possibly ignored" (W6).

   Start it with:  python3 backend.py --session <dir> --handoff handoff.json */
var SERVER = {
  base: (location.protocol === "http:" ? "" : "http://127.0.0.1:8379"),
  epoch: null, cursor: 0, sent: 0, got: 0, up: null, inflight: false,
  hydrated: false, rejected: 0, lastRejection: null,
  // server seq -> this page's own event seq, learned from receipts. The server
  // owns ordering on the wire; the page keeps its own log, and this is the join
  // that lets basedOnSeq keep meaning what round 3 built it to mean.
  seqmap: {}, pendingCid: {},
  status: null, statusSince: 0
};
// One page instance, so an idempotency key is stable for a retry and distinct
// across reloads — a reload's events are genuinely new, a resend is not.
var PAGE_ID = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function srvURL(p) { return SERVER.base + p; }
function srvPost(path, body) {
  return fetch(srvURL(path), {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
  }).then(function (r) {
    if (!r.ok) throw new Error("server returned " + r.status);
    return r.json();
  });
}
function srvUp(ok) {
  if (SERVER.up === ok) return;
  SERVER.up = ok;
  render();
}

// Everything the session just did, out to the backend. Hydration replays the
// server's own answers back into this page, so it must not echo them home.
function srvSend(evs) {
  if (!evs.length || !SERVER.epoch || SERVER.hydrating) return;
  var out = evs.map(function (e) {
    var c = {};
    for (var k in e) if (e.hasOwnProperty(k)) c[k] = e[k];
    c.clientSeq = e.seq;      // the page's log position, as data — not a claim
    delete c.seq;             // the server assigns the only seq that orders anything
    c.cid = PAGE_ID + ":" + e.seq;
    SERVER.pendingCid[c.cid] = e.seq;
    return c;
  });
  SERVER.sent += out.length;
  srvPost("/session/events", { epoch: SERVER.epoch, events: out }).then(function (j) {
    srvUp(true);
    (j.receipts || []).forEach(function (r) {
      if (r.status === "accepted" && r.seq) SERVER.seqmap[r.seq] = SERVER.pendingCid[r.cid];
      if (r.status === "rejected") {
        SERVER.rejected++;
        // A rejection the user cannot see is the W6 silent no-op wearing a
        // receipt. Their message did not land; say so where they are looking.
        SERVER.lastRejection = r;
        // The stale-epoch case means this page is talking to a backend that
        // restarted under it.
        if ((r.reason || "").indexOf("epoch") >= 0) SERVER.hydrated = false;
      }
      delete SERVER.pendingCid[r.cid];
    });
    render();
  }, function () { srvUp(false); });
}

// The board, asked for rather than asserted. This is what a reload gets.
function hydrateFrom(st) {
  SERVER.epoch = st.epoch;
  SERVER.cursor = st.seq;          // resume the cursor: no backlog re-processing (W3)
  SERVER.hydrating = true;
  try {
    (st.image1.decisions || []).forEach(function (d) {
      if (!d.answer) return;
      if (Grill.statusOf(S, d.id) === "settled") return;
      var opt = null;
      (d.options || []).forEach(function (o) { if (o.text === d.answer) opt = o.id; });
      dispatch(opt ? { type: "answer", id: d.id, payload: { optionId: opt }, source: "user" }
                   : { type: "answer", id: d.id, payload: { free: true, text: d.answer }, source: "user" });
    });
  } finally { SERVER.hydrating = false; }
  SERVER.hydrated = true;
  render();
}

// The status lane. These never carry judgement and never wait on a model — the
// backend emits them the instant it accepts a turn, which is the whole point
// (L1/W4). The page treats them as instrumentation, not as board state.
function applyStatus(it) {
  if (it.phase === "received") { SERVER.statusSince = Date.now(); SERVER.status = it; return; }
  if (it.phase === "done" || it.phase === "error") { SERVER.status = null; return; }
  SERVER.status = it;
}
function laneText() {
  if (!SERVER.status) return "";
  var p = SERVER.status.phase;
  return (p === "upgrading" ? "escalating to the heavy tier" : p === "received" ? "received" : "composing")
    + "… " + Math.round((Date.now() - SERVER.statusSince) / 1000) + "s";
}

// Backend event -> the round-3 update taxonomy this page already knows.
function toUpdate(it) {
  if (it.kind !== "thread-turn" || it.src !== "agent") return null;
  var basis = SERVER.seqmap[it.in_reply_to] || 0;
  if (it.threadId && S.threads[it.threadId]) {
    return { kind: "thread-turn", id: "srv-" + it.seq, threadId: it.threadId, nodeId: it.nodeId,
             basedOnSeq: basis, turns: [{ who: "agent", text: it.text }] };
  }
  // A reply provoked by answering a decision belongs to no thread the user
  // opened, so it lands as a note on the node — a kind the board already has.
  return { kind: "informational", id: "srv-" + it.seq, nodeId: it.nodeId, basedOnSeq: basis,
           summary: (it.tier === "heavy" ? "Heavy tier — " : "Agent — ") + String(it.text).slice(0, 90),
           text: it.text };
}

function srvPoll() {
  if (SERVER.inflight) return;
  SERVER.inflight = true;
  if (!SERVER.hydrated) {
    fetch(srvURL("/session/state")).then(function (r) {
      if (!r.ok) throw new Error("server returned " + r.status);
      return r.json();
    }).then(function (st) {
      SERVER.inflight = false; srvUp(true); hydrateFrom(st);
    }, function () { SERVER.inflight = false; srvUp(false); });
    return;
  }
  fetch(srvURL("/session/updates?since=" + SERVER.cursor + "&epoch=" + encodeURIComponent(SERVER.epoch)))
    .then(function (r) {
      // 409 is the backend telling us it is not the process we started with.
      // Re-hydrate rather than carry a stale board forward — this is the W1
      // trap, and the server is the one who can see it.
      if (r.status === 409) { SERVER.hydrated = false; throw new Error("epoch changed"); }
      if (!r.ok) throw new Error("server returned " + r.status);
      return r.json();
    }).then(function (j) {
      SERVER.inflight = false;
      srvUp(true);
      if (!j.items || !j.items.length) return;
      SERVER.cursor = j.next;
      SERVER.got += j.items.length;
      var ups = [];
      j.items.forEach(function (it) {
        if (it.kind === "agent-status") return applyStatus(it);
        if (it.kind === "dispatch" || it.kind === "session-start" || it.kind === "session-resume") return;
        var u = toUpdate(it);
        if (u) ups.push(u);
      });
      if (ups.length) S = Grill.reduce(S, { type: "agentResponse", updates: ups });
      render();
    }, function () { SERVER.inflight = false; srvUp(false); });
}
setInterval(srvPoll, 500);
srvPoll();
// The lane's timer ticks without a full render, so a running clock never steals
// focus from the textbox T2 promised would always hold it.
setInterval(function () {
  var el = document.getElementById("lanetimer");
  if (el) el.textContent = laneText();
}, 1000);
// Browsers throttle timers in a background tab, so replies pile up on the
// server while you are elsewhere. Collect them the moment you are back.
document.addEventListener("visibilitychange", function () { if (!document.hidden) srvPoll(); });

function dispatch(a) {
  var prev = S;
  S = Grill.reduce(S, a);
  if (S !== prev) {
    var evs = S.events.slice(prev.events.length);
    srvSend(evs);
    if (a.type === "answer" || a.type === "foldThread" || a.type === "applyPending") {
      var settled = evs.filter(function (e) { return e.kind === "answer" || e.kind === "answer-release"; })[0];
      if (settled && Grill.statusOf(S, settled.nodeId) === "settled") {
        UI.justSettled = settled.nodeId;                  // U14: animate the compaction
        UI.open[settled.nodeId] = false;
        var nxt = Grill.nextFocus(S, settled.nodeId);
        if (nxt) focusOn(nxt);
      }
    }
  }
  render();
}
function focusOn(id) { UI.focus = id; UI.centerNext = true; }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];
  });
}
function nv(id) { return Grill.nodeView(S, id); }
var LABELS = {
  settled: "settled", open: "on the frontier", blocked: "waiting", stale: "needs re-confirming",
  "stale-blocked": "stale · waiting", fogged: "fog", conflicted: "conflict — needs judging",
  "conflict-blocked": "waiting on a conflict upstream", reassessing: "the agent is reassessing this",
  "awaiting-thread": "answer held · thread must conclude", invalidated: "left the flow"
};

// Reset clears the VIEWER, not the session. The log is append-only and lives on
// the server; a page cannot unmake it, and pretending otherwise is how round 4
// let a reconnect look like a reset. This drops local state and re-hydrates —
// so the honest outcome of "reset" here is the board coming straight back.
function resetAll() {
  LS.clear();
  S = Grill.initial(true);
  UI.open = {}; UI.drafts = {}; UI.panel = null;
  UI.bubbles = []; UI.bubbleSeen = {}; UI.justSettled = null; UI.unreadOnly = true; UI.popped = {};
  SERVER.cursor = 0; SERVER.sent = 0; SERVER.got = 0; SERVER.rejected = 0;
  SERVER.seqmap = {}; SERVER.pendingCid = {}; SERVER.status = null;
  SERVER.hydrated = false;
  focusOn("D1"); render(); srvPoll();
}

/* ---------- scenario helpers that drive the real controls ---------- */
function openThread(tid) { dispatch({ type: "openThread", id: tid }); UI.panel = { kind: "thread", id: tid }; render(); }
function openLatestThread() { UI.panel = { kind: "thread", id: S.threadOrder[S.threadOrder.length - 1] }; render(); }
// U19: the panel opens on a DRAFT. Nothing exists until something is said.
function openDraftThread(nodeId) { UI.panel = { kind: "thread", draftFor: nodeId }; render(); }
function seedDraft(key) {
  if (!UI.panel || UI.panel.kind !== "thread") return;
  if (UI.panel.draftFor) { dispatch({ type: "newThread", id: UI.panel.draftFor, seed: key }); openLatestThread(); }
  else dispatch({ type: "threadSeed", id: UI.panel.id, seed: key });
}
function sayInPanel(text) {
  if (!UI.panel || UI.panel.kind !== "thread") return;
  if (UI.panel.draftFor) { dispatch({ type: "newThread", id: UI.panel.draftFor, text: text }); openLatestThread(); }
  else dispatch({ type: "threadSay", id: UI.panel.id, text: text });
}
function openThreadOn(nodeId) {
  var t = Grill.threadsOf(S, nodeId);
  if (t.length) openThread(t[t.length - 1]); else openDraftThread(nodeId);
}
function openConflict(nodeId) {
  var c = S.conflicts[nodeId];
  if (c) { focusOn(nodeId); openThread(c.threadId); }
}
function discussFirstPending() {
  var p = Grill.pending(S)[0];
  if (!p) return;
  dispatch({ type: "discussPending", updateId: p.id });
  UI.panel = { kind: "thread", id: p.threadId }; render();
}
function dismissPanelUpdate() {
  if (!UI.panel || UI.panel.kind !== "thread") return;
  var t = S.threads[UI.panel.id];
  if (!t || !t.updateId) return;
  dispatch({ type: "dismissUpdate", updateId: t.updateId });
  UI.panel = null; render();
}
function foldPanelThread() {
  if (!UI.panel || UI.panel.kind !== "thread" || UI.panel.draftFor) return;
  dispatch({ type: "foldThread", id: UI.panel.id }); UI.panel = null; render();
}
function parkPanelThread() {
  if (!UI.panel || UI.panel.kind !== "thread" || UI.panel.draftFor) return;
  dispatch({ type: "parkThread", id: UI.panel.id }); UI.panel = null; render();
}
function abandonFocus(nodeId) {
  dispatch({ type: "abandonAnswer", id: nodeId }); UI.panel = null; focusOn(nodeId); render();
}

/* ---------- fragments ---------- */
function pill(status, extra) {
  return '<span class="pill ' + status + '">' + LABELS[status] + "</span>" + (extra || "");
}
// U16: every agent-supplied option carries its own trade-offs, on hover.
function pcrAttrs(o) {
  var p = o.pcr || GENERIC_PCR;
  return ' data-p="' + esc(p[0]) + '" data-c="' + esc(p[1]) + '" data-r="' + esc(p[2]) + '"' +
    ' data-otext="' + esc(o.text) + '"';
}
function answerControls(v, locked) {
  var h = "", dis = locked ? " disabled" : "";
  if (v.answerText) h += '<div class="prior"><strong>Currently:</strong> ' + esc(v.answerText) + "</div>";
  if (v.pendingAnswer) h += '<div class="prior"><strong>Held, not applied:</strong> ' +
    esc(v.pendingAnswer.free ? v.pendingAnswer.text
      : (v.options.filter(function (o) { return o.id === v.pendingAnswer.optionId; })[0] || {}).text) + "</div>";
  h += '<div class="rec-line">Recommended answer' + (locked ? " · locked" : "") + "</div>";
  h += '<button class="btn primary wide" data-act="pick" data-id="' + v.id + '" data-opt="' + v.recommended.id + '"' +
    pcrAttrs(v.recommended) + dis + ">➡️ " + esc(v.recommended.text) + "</button>";

/* ---------- the map ---------- */
var POS = {};

function badge(cls, glyph, why, act, data) {

    (act ? ' data-act="' + act + '"' : "") + (data || "") + ">" + glyph + "</span>";
}
function renderMap() {
  var ls = Grill.layers(S), maxDepth = ls.length - 1;
  var COL = 158, ROW = 88, X0 = 26, Y0 = 26, NW = 118, NH = 54;
  var fogCol = maxDepth + 1, slots = [];
  POS = {};
  S.order.forEach(function (id) {
    var v = nv(id), col = v.fogged ? fogCol : v.depth;
    slots[col] = slots[col] || [];
    slots[col].push(id);
  });
  var rows = 1;
  slots.forEach(function (ids, col) {
    if (!ids) return;
    rows = Math.max(rows, ids.length);
    ids.forEach(function (id, i) { POS[id] = { x: X0 + col * COL, y: Y0 + i * ROW }; });
  });
  var W = X0 + (fogCol + 1) * COL, H = Math.max(600, Y0 + rows * ROW + 20);

  var edges = "";
  S.order.forEach(function (id) {
    S.nodes[id].prereqs.forEach(function (p) {
      var a = POS[p], b = POS[id];
      if (!a || !b) return;
      var done = Grill.isSettled(S, p);
      edges += '<path d="M' + (a.x + NW) + "," + (a.y + NH / 2) + " C" + (a.x + NW + 40) + "," + (a.y + NH / 2) +
        " " + (b.x - 40) + "," + (b.y + NH / 2) + " " + b.x + "," + (b.y + NH / 2) +
        '" fill="none" stroke="' + (done ? "#94a3b8" : "#e2e8f0") + '" stroke-width="' + (done ? 1.4 : 1) + '"' +
        (done ? "" : ' stroke-dasharray="3 3"') + "/>";

  });

  var nodes = "";
  S.order.forEach(function (id) {
    var v = nv(id), p = POS[id];
    var badges = "";
    // U12: each icon explains itself, so ✉ and ⚠ on one node are never a guess.
    if (v.infoUnread) badges += badge("b-mail mail", "✉", "Unread note from the agent — click to read it on the block, no need to reopen the decision.", "gotoinfo", ' data-id="' + id + '"');
    if (v.blocking.length) badges += badge("b-alert alerting", "⚠", "The agent raised a question that must be concluded before this decision can change.", "openthread", ' data-tid="' + v.blocking[0] + '"');
    else if (v.threads.some(function (t) { return S.threads[t].status === "suggested"; }))
      badges += badge("b-alert", "⚠", "The agent suggests a thread here. Nothing is blocked.", "openthread",
        ' data-tid="' + v.threads.filter(function (t) { return S.threads[t].status === "suggested"; })[0] + '"');
    if (v.pendingUpdates.length) badges += badge("b-pending", "📥", "A change is waiting in the inbox for this decision. It cannot be decided until that is applied or dismissed.", "inbox", "");
    if (v.conflict) badges += badge("b-conflict", "⚡", "Your answer and the agent's update disagree. Click to open the thread that judges it.", "openthread", ' data-tid="' + v.conflict.threadId + '"');
    if (v.mandate && v.mandateOpen) badges += badge("b-mandate", "⚖", "This decision cannot be settled by choosing. Its mandated thread has to conclude first.", "focusnode", ' data-id="' + id + '"');
    if (v.threads.some(function (t) { return S.threads[t].status === "parked"; }))
      badges += badge("b-thread", "⑂", "A parked thread hangs off this decision. Nothing is blocked by it.", "threads", ' data-id="' + id + '"');

    var mandated = v.mandate && v.mandateOpen ? " mandated" : "";
    var plock = v.pendingUpdates.length ? " pendlocked" : "";
    nodes += '<button class="mnode ' + v.status + mandated + plock + (UI.focus === id ? " focused" : "") +
      (v.fresh ? " fresh" : "") + (v.touched ? " touched" : "") +
      '" style="left:' + p.x + "px;top:" + p.y + 'px" data-act="mapnode" data-id="' + id + '">' +
      '<span class="mid">' + (v.fogged ? "· · ·" : id) + "</span><br>" + esc(v.short) +
      // F6: the lock reads at a glance, not only as one badge among several.
      (v.lock ? " 🔒" : "") +
      (v.status === "open" ? " ❓" : v.status === "settled" ? " ✓" : v.status.indexOf("stale") === 0 ? " ⚠" : "") +
      // R8: downstream of a conflict says what it is waiting for instead of shouting.

      '<span class="badges">' + badges + "</span></button>";

  var c = Grill.counts(S), fogX = X0 + fogCol * COL - 50;
  return '<div class="card"><h3>The board <span class="spacer"></span>' +
    '<span class="muted">drag to pan · click a node to focus it · hover an icon to see what it is</span></h3>' +
    '<div class="mapscroll" id="mapscroll"><div class="mapcanvas" style="width:' + W + "px;height:" + H + 'px">' +
    '<svg width="' + W + '" height="' + H + '">' + edges + "</svg>" + nodes +
    '<div class="fogbank" style="left:' + fogX + "px;width:" + (W - fogX) + 'px"></div>' +
    '<div class="foglabel" style="left:' + (fogX + 26) + 'px">fog</div></div></div>' +
    '<div class="maplegend"><span class="lg-settled">settled · ' + c.settled + "</span>" +
    '<span class="lg-open">frontier · ' + c.open + "</span>" +
    '<span class="lg-stale">stale · ' + c.stale + "</span>" +
    '<span class="lg-reassess">reassessing · ' + c.reassessing + "</span>" +
    '<span class="lg-conflict">conflict · ' + c.conflict + "</span>" +
    '<span class="lg-blocked">waiting · ' + c.blocked + "</span>" +
    '<span class="lg-fogged">fog · ' + c.fogged + "</span></div></div>";
}

// Only the top bubble's clock runs, so they pop one at a time. Elapsed real time,

// drain pauses with it off the same :hover.
setInterval(function () {
  var el = document.getElementById("bubbles");
