/* ---------- render, preserving what the user is doing ---------- */
function render() {
  // A reply can arrive before the document has finished parsing — the backend is
  // polled from the moment this script runs, and the shell is markup below it.
  // The state is already folded; DOMContentLoaded draws it.
  if (!document.getElementById("shell")) return;
  var map = document.getElementById("mapscroll"), col = document.getElementById("column");
  var keep = { mx: map ? map.scrollLeft : 0, my: map ? map.scrollTop : 0, cy: col ? col.scrollTop : 0 };
  var act = document.activeElement;
  var focusId = act && act.tagName === "TEXTAREA" ? act.id : null;
  var caret = focusId ? act.selectionStart : 0;

  harvestBubbles();
  renderShell();
  renderBubbles();

  document.querySelectorAll("textarea[data-draft]").forEach(function (ta) {
    var d = UI.drafts[ta.dataset.draft];
    if (d) ta.value = d;
  });
  var map2 = document.getElementById("mapscroll"), col2 = document.getElementById("column");
  if (map2) { map2.scrollLeft = keep.mx; map2.scrollTop = keep.my; }
  // Hold your place across a re-render. Always — the fresh element starts at 0,
  // and centerOn measures "is it already in view?" against where the panel is.
  if (col2) col2.scrollTop = keep.cy;

  if (UI.centerNext && UI.focus) { centerOn(UI.focus, !!UI.justSettled); UI.centerNext = false; }
  UI.justSettled = null;

  // T2: a thread claims the caret the moment it opens — but only then, so a
  // later re-render never yanks it out of whatever you are typing in.
  var panelKey = UI.panel ? UI.panel.kind + ":" + (UI.panel.id || UI.panel.draftFor || "") : null;
  var panelJustOpened = panelKey !== UI.lastPanelKey && UI.panel && UI.panel.kind === "thread";
  UI.lastPanelKey = panelKey;

  if (panelJustOpened && document.getElementById("ft-say")) {
    document.getElementById("ft-say").focus();
  } else if (focusId) {
    var again = document.getElementById(focusId);
    if (again) { again.focus(); try { again.setSelectionRange(caret, caret); } catch (e) {} }
  } else if (UI.panel && UI.panel.kind === "thread") {
    var say = document.getElementById("ft-say");
    if (say) say.focus();
  } else if (UI.focus !== UI.lastFocus || document.activeElement === document.body) {
    // A3: the focused decision's free-text box holds focus by default. Only
    // ever taken when nothing else holds it, so typing is never interrupted.
    var box = document.getElementById("ft-" + UI.focus);
    if (box && !UI.panel && !box.disabled) box.focus();
  }
  UI.lastFocus = UI.focus;
}
// S2: the map auto-centres on whatever the column is focused on, and vice versa.
// U14: after an auto-advance the column glides rather than jumping.
function centerOn(id, smooth) {
  var map = document.getElementById("mapscroll"), p = POS[id];
  if (map && p) {
    map.scrollLeft = Math.max(0, p.x - map.clientWidth / 2 + 58);
    map.scrollTop = Math.max(0, p.y - map.clientHeight / 2 + 26);
  }
  var col = document.getElementById("column"), item = document.getElementById("col-" + id);
  if (!col || !item) return;
  var top = item.offsetTop, bottom = top + item.offsetHeight;
  var viewTop = col.scrollTop, viewBottom = viewTop + col.clientHeight, pad = 10;
  // Already fully in view: no scroll at all.
  if (top >= viewTop && bottom <= viewBottom) return;
  // Otherwise land it FULLY in view — never clipped above the top edge.
  var target = (bottom - top > col.clientHeight || top < viewTop)
    ? top - pad                              // above, or taller than the panel: pin its top
    : bottom - col.clientHeight + pad;       // below: bring its bottom up
  // Set directly rather than animating: every re-render replaces this element, so
  // an in-flight smooth scroll is destroyed mid-way and lands wherever it got to.
  // The compaction cue carries the motion instead.
  col.scrollTop = Math.max(0, Math.min(target, col.scrollHeight - col.clientHeight));
}

/* ---------- the pop-out window (U18, stretch) ---------- */
// F12: a popped-out draft has no thread id yet, so it travels as "draft:<node>"
// and resolves to whatever that draft creates — nothing until something is said.
function resolveThread(tid) {
  if (tid.indexOf("draft:") !== 0) return tid;
  var node = tid.slice(6), base = UI.draftBase[node] || 0;
  return S.threadOrder.slice(base).filter(function (t) { return S.threads[t].anchor === node; })[0] || null;
}
window.threadHTML = function (tid) {
  var real = resolveThread(tid);
  return real ? threadBody(real, true) : draftBody(tid.slice(6), true);
};
window.popAct = function (tid, act, seedKey, text) {
  var real = resolveThread(tid);
  if (!real) {                                   // still a draft: the first thing said creates it
    var node = tid.slice(6);
    if (act === "draftseed" || act === "seed") dispatch({ type: "newThread", id: node, seed: seedKey });
    else if ((act === "draftsay" || act === "say") && text && text.trim())
      dispatch({ type: "newThread", id: node, text: text.trim() });
    return;
  }
  if (act === "seed") dispatch({ type: "threadSeed", id: real, seed: seedKey });
  else if (act === "asked" || act === "say") { if (text && text.trim()) dispatch({ type: "threadSay", id: real, text: text.trim() }); }
  else if (act === "fold") dispatch({ type: "foldThread", id: real });
  else if (act === "park") dispatch({ type: "parkThread", id: real });
  else if (act === "dismissthread") dispatch({ type: "dismissThread", id: real });
  else if (act === "dismissupdate") dispatch({ type: "dismissUpdate", updateId: S.threads[real].updateId });
  else if (act === "applyone") dispatch({ type: "applyPending", updateId: S.threads[real].updateId });
  else if (act === "abandon") dispatch({ type: "abandonAnswer", id: S.threads[real].anchor });
};
function popOut(tid) {
  var w = null;
  try { w = window.open("", "grill_" + tid.replace(/[^A-Za-z0-9]/g, "_"), "width=560,height=840"); } catch (e) { w = null; }
  if (!w) { UI.popFail = true; render(); return; }
  UI.popFail = false;
  // A draft resolves only to threads created after it was popped out.
  if (tid.indexOf("draft:") === 0) UI.draftBase[tid.slice(6)] = S.threadOrder.length;
  var css = document.querySelector("style").outerHTML;
  // draw() only touches the DOM when the HTML actually changed. Repainting on
  // every tick replaced the button between mousedown and mouseup, so a real
  // click on Dismiss never became a click event.
  var boot = "(function(){var tid=" + JSON.stringify(tid) + ";var last=null;" +
    "function draw(){var html;" +
    "try{html=window.opener.threadHTML(tid);}catch(e){document.getElementById('t').innerHTML='<p>The main window is gone. Close this one.</p>';return;}" +
    "if(html===last)return;last=html;" +
    "var ta=document.getElementById('pop-say');var v=ta?ta.value:'';var had=ta&&document.activeElement===ta;" +
    "document.getElementById('t').innerHTML=html;" +
    "var t2=document.getElementById('pop-say');if(t2){t2.value=v;if(had)t2.focus();}}" +
    "document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;" +
    "var ta=document.getElementById('pop-say');" +
    "try{window.opener.popAct(tid,el.dataset.act,el.dataset.seed,el.dataset.otext||(ta?ta.value:''));}catch(x){}" +
    "if(ta&&(el.dataset.act==='say'||el.dataset.act==='asked'))ta.value='';setTimeout(draw,40);});" +
    "document.addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){var b=document.querySelector('[data-act=\"say\"]');if(b)b.click();}});" +
    "setInterval(draw,600);draw();})();";

  w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Thread — ' + esc(tid) + "</title>" + css +
    "<style>body{padding:20px;background:#fff}</style></head><body><div id=\"t\"></div><scr" + "ipt>" + boot + "</scr" + "ipt></body></html>");
  w.document.close();
  UI.popped[tid] = true;
  UI.panel = null;
  render();
}

/* ---------- events ---------- */
document.addEventListener("input", function (e) {

function sendFrom(ta) {
  var kind = ta.dataset.send;
  if (kind === "free") {
    if (!ta.value.trim()) return;
    dispatch({ type: "answer", id: ta.dataset.id, payload: { free: true, text: ta.value.trim() } });
    UI.drafts[ta.dataset.id] = ""; UI.open[ta.dataset.id] = false; render();
  } else if (kind === "say") {
    if (!ta.value.trim()) return;
    dispatch({ type: "threadSay", id: ta.dataset.tid, text: ta.value.trim() });
    UI.drafts.__say = ""; render();
  } else if (kind === "draftsay") {
    if (!ta.value.trim()) return;

    UI.drafts.__say = ""; openLatestThread();

// T3: Cmd/Ctrl+Enter sends, in threads and decision free-text alike. Enter is a newline.
document.addEventListener("keydown", function (e) {

      break;
    }

    // F9: "show me" is a navigation intent — it lands the decision open so there
    // is something to look at. Not a reopen: ⌃ still collapses it.
    case "gotonode": focusOn(id); UI.open[id] = true; UI.panel = null; render(); break;
    // U10: jump to the unread note without reopening the decision.

    case "history": UI.open["hist-" + id] = !UI.open["hist-" + id]; render(); break;
    case "threads": openThreadOn(id); break;
    case "newthread": openDraftThread(id); break;
    case "draftseed": dispatch({ type: "newThread", id: id, seed: el.dataset.seed }); openLatestThread(); break;
    case "draftsay": sendFrom(document.getElementById("ft-say")); break;
    case "openthread": openThread(tid); break;
    case "relitigate": dispatch({ type: "relitigate", id: tid }); openLatestThread(); break;
    case "seed": dispatch({ type: "threadSeed", id: tid, seed: el.dataset.seed }); break;
    case "asked": dispatch({ type: "threadSay", id: tid, text: el.dataset.otext }); break;
    case "say": sendFrom(document.getElementById("ft-say")); break;

    case "readinfo": {
      var note = S.nodes[id] && S.nodes[id].info;
      if (note) dispatch({ type: "readNote", id: note.id, nodeId: id });
      break;
    }
    case "marknote": dispatch({ type: "readNote", id: el.dataset.nid }); break;
    case "apply": dispatch({ type: "applyPending" }); UI.panel = null; render(); break;
    case "applyone": dispatch({ type: "applyPending", updateId: uid }); UI.panel = null; render(); break;
    case "discuss": dispatch({ type: "discussPending", updateId: uid }); UI.panel = { kind: "thread", id: "P-" + uid }; render(); break;
    case "dismissupdate": dispatch({ type: "dismissUpdate", updateId: uid }); UI.panel = null; render(); break;
    case "inbox": UI.panel = { kind: "inbox" }; render(); break;
    case "notifications": UI.panel = { kind: "notifications" }; render(); break;
    case "filter": UI.unreadOnly = el.dataset.v === "1"; LS.set("unreadOnly", UI.unreadOnly); render(); break;
    case "autoapply": {
      var on = el.checked;
      LS.set("autoApply", on);
      dispatch({ type: "setAutoApply", on: on });
      break;
    }
    case "closepanel": UI.panel = null; render(); break;
    case "bubble": {
      UI.bubbles = UI.bubbles.filter(function (b) { return b.id !== el.dataset.nid; });
      dispatch({ type: "readNote", id: el.dataset.nid });
      break;
    }
    case "notify": {
      var n = Grill.notifications(S).filter(function (x) { return x.id === el.dataset.nid; })[0];
      if (!n) return;
      dispatch({ type: "readNote", id: n.id, nodeId: n.nodeId });
      if (n.nodeId) { focusOn(n.nodeId); UI.open[n.nodeId] = true; }   // F9
      if (n.action === "thread" && n.threadId) openThread(n.threadId);
      else if (n.action === "conflict" && S.conflicts[n.nodeId]) openThread(S.conflicts[n.nodeId].threadId);
      else { UI.panel = null; render(); }
      break;
    }
    case "reset": resetAll(); break;
    case "dismiss-rejection": SERVER.lastRejection = null; render(); break;
  }
});

/* hover overlays: map nodes (A4), their icons (U12), and options (U16) */
var HOVER = null;
function showHover(html, rect) {
  if (!HOVER) { HOVER = document.createElement("div"); HOVER.className = "hovercard"; document.body.appendChild(HOVER); }
  HOVER.innerHTML = html;
  HOVER.style.left = Math.min(window.innerWidth - 340, Math.max(6, rect.left)) + "px";
  HOVER.style.top = (rect.bottom + 8 > window.innerHeight - 140 ? rect.top - 130 : rect.bottom + 8) + "px";
  HOVER.style.display = "block";
}
document.addEventListener("mouseover", function (e) {
  var b = e.target.closest("[data-why]");
  if (b) { showHover('<div class="hid">what this icon means</div><div>' + esc(b.dataset.why) + "</div>", b.getBoundingClientRect()); return; }
  var o = e.target.closest("[data-p]");
  if (o) {
    showHover('<div class="hid">this option</div><div><strong>' + esc(o.dataset.otext) + "</strong></div>" +
      '<div class="pcr"><b>buys you</b>' + esc(o.dataset.p) + "</div>" +
      '<div class="pcr"><b>costs you</b>' + esc(o.dataset.c) + "</div>" +
      '<div class="pcr"><b>forces later</b>' + esc(o.dataset.r) + "</div>", o.getBoundingClientRect());
    return;
  }
  var n = e.target.closest(".mnode");
  if (!n) return;
  var v = nv(n.dataset.id);
  var att = [];
  if (v.infoUnread) att.push("✉ an unread note from the agent");
  if (v.pendingUpdates.length) att.push("📥 a change waiting in the inbox — this decision is locked");
  if (v.blocking.length) att.push("⚠ a thread that must conclude before this can change");
  if (v.conflict) att.push("⚡ a disagreement waiting to be judged");
  if (v.mandate && v.mandateOpen) att.push("⚖ settling this needs its mandated thread");
  showHover('<div class="hid">' + (v.fogged ? "fogged" : v.id) + " · " + LABELS[v.status] + "</div>" +
    "<div><strong>" + esc(v.title) + "</strong></div>" +
    (v.body ? "<div>" + esc(v.body.slice(0, 150)) + (v.body.length > 150 ? "…" : "") + "</div>" : "") +
    (v.answerText ? '<div style="opacity:.75;margin-top:4px">→ ' + esc(v.answerText.slice(0, 110)) + "</div>" : "") +
    (att.length ? '<div class="att">' + att.map(function (x) { return "<div>" + x + "</div>"; }).join("") + "</div>" : ""),
    n.getBoundingClientRect());
});
document.addEventListener("mouseout", function (e) {
  if (HOVER && (e.target.closest(".mnode") || e.target.closest("[data-why]") || e.target.closest("[data-p]"))) HOVER.style.display = "none";
});
// U7's hover-pause is CSS :hover, read by the tick above. Listeners that set a
// flag could not survive the re-render that destroyed the hovered element.

/* drag to pan the map */
var DRAG = null;
document.addEventListener("mousedown", function (e) {
  var m = e.target.closest("#mapscroll");
  if (!m || e.target.closest(".mnode")) return;
  DRAG = { el: m, x: e.clientX, y: e.clientY, sl: m.scrollLeft, st: m.scrollTop };
  m.classList.add("grabbing");
  e.preventDefault();
});
document.addEventListener("mousemove", function (e) {
  if (!DRAG) return;
  DRAG.el.scrollLeft = DRAG.sl - (e.clientX - DRAG.x);
  DRAG.el.scrollTop = DRAG.st - (e.clientY - DRAG.y);
});
document.addEventListener("mouseup", function () {
  if (DRAG) DRAG.el.classList.remove("grabbing");
  DRAG = null;
});

document.addEventListener("DOMContentLoaded", render);
</script>

<div id="overlay"></div>
<div class="bubbles" id="bubbles"></div>
