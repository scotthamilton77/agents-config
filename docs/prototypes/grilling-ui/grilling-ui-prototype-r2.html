      if (v.status === "conflicted") h += '<div class="conflict-notice">The agent\'s update disagrees with your answer. <button class="btn sm warn" data-act="openthread" data-tid="' + v.conflict.threadId + '">Open the conflict thread</button></div>';
      if (v.status === "reassessing") h += '<div class="muted" style="margin-top:5px">Possibly affected by your change to ' + v.provisional + ". The agent is reassessing it.</div>";
      if (v.status === "invalidated" || v.status === "blocked" || v.status === "stale-blocked" || v.status === "fogged" || v.status === "conflict-blocked")
        h += '<button class="btn sm" data-act="expand" data-id="' + id + '" style="margin-top:6px">Details</button>';
    } else {
      if (v.status === "conflicted") {
        h += '<div class="conflict-notice">Blocked pending your judgement — everything downstream of ' + id +
          ' is blocked too. <button class="btn sm warn" data-act="openthread" data-tid="' + v.conflict.threadId + '">Open the conflict thread</button></div>';
      }
      if (v.mandate && !(S.threads[v.mandate.threadId] && S.threads[v.mandate.threadId].status === "folded")) {
        h += '<div class="mandate-notice"><strong>This decision requires a thread.</strong> ' + esc(v.mandate.notice) + "</div>";
      }
      if (v.status === "awaiting-thread") {
        h += '<div class="mandate-notice">Your answer is held. <button class="btn sm" data-act="openthread" data-tid="' + v.mandate.threadId + '">Open the mandated thread</button> — concluding it is what settles this.</div>';
      }
      h += '<div class="q-body">' + esc(v.body) + "</div>";
      if (v.status === "fogged" || v.status === "invalidated" || v.status === "conflict-blocked" || v.status === "blocked" || v.status === "stale-blocked") {
        h += '<div class="muted">' + (v.fogged ? "Not a real question yet. It sharpens once " + v.fogUntil + " settles."
          : v.status === "invalidated" ? "The agent took this out of the flow. It stays on the board — relitigate it by opening a thread."
          : v.status === "conflict-blocked" ? "An upstream conflict has to be judged before this can move."
          : "Waiting on " + v.prereqs.join(", ") + ".") + "</div>";
      } else {
        h += answerControls(v);
      }
      if (v.info) h += '<div class="parked-note"><strong>Agent, informational:</strong> ' + esc(v.info.text) + "</div>";
      v.threads.forEach(function (tid) {
        var t = S.threads[tid];
        h += '<div class="parked-note">⑂ ' + esc(t.title) + " — <em>" + t.status + "</em> " +
          '<button class="btn sm" data-act="openthread" data-tid="' + tid + '">' +
          (t.status === "folded" ? "View" : t.status === "parked" ? "Pick it back up" : "Open") + "</button>" +
          (t.status === "folded" ? ' <button class="btn sm" data-act="relitigate" data-tid="' + tid + '">Relitigate</button>' : "") + "</div>";
      });
      if (!v.threads.length) h += '<div style="margin-top:9px"><button class="btn sm" data-act="newthread" data-id="' + id + '">⑂ Start a thread on ' + id + "</button></div>";
      if (v.status === "settled") h += '<button class="btn sm" data-act="collapse" data-id="' + id + '" style="margin-top:8px">Leave it as it is</button>';
      if (!answerable && v.status !== "settled") h += '<button class="btn sm" data-act="collapse" data-id="' + id + '" style="margin-top:8px">Close</button>';
    }
    if (UI.open["hist-" + id]) {
      h += '<div class="hist"><strong style="font-size:12px">Change history — ' + id + "</strong>";
      var hist = Grill.historyOf(S, id);
      if (!hist.length) h += '<div class="muted">Nothing has happened to this decision yet.</div>';
      hist.forEach(function (e) { h += '<div><span class="s">#' + e.seq + "</span>" + esc(e.label) + "</div>"; });
      h += "</div>";
    }
    h += "</div>";
  });
  h += "</div></div>";
  return h;
}

/* ---------- slide-outs ---------- */
function renderThread(tid) {
  var t = S.threads[tid];
  if (!t) return "";
  var v = nv(t.anchor);
  var foldable = t.turns.filter(function (x) { return x.foldable; });
  var last = foldable[foldable.length - 1];
  var h = '<div class="slide"><button class="close" data-act="closepanel">✕</button>';
  h += '<span class="pill open">' + t.kind + " thread</span>";
  h += '<h3 style="margin:10px 0 4px;font-size:16px">' + esc(t.title) + "</h3>";
  h += '<div class="muted" style="margin-bottom:14px">On ' + t.anchor + " · " + esc(v.short) +
    (t.seededFrom ? " · seeded from " + t.seededFrom : "") +
    ". Nothing here touches the decision until you conclude it.</div>";
  t.turns.forEach(function (turn) {
    h += '<div class="turn ' + turn.who + '"><div class="who">' + (turn.who === "agent" ? "Agent" : turn.auto ? "You (auto-drafted)" : "You") + "</div>" +
      "<p>" + esc(turn.text) + "</p>";
    if (turn.who === "agent") {
      h += turn.foldable
        ? '<div class="foldmeta"><strong>foldable</strong> — ' + esc(turn.impact ? turn.impact.summary : "impact declared") +
          (turn.disruptive ? " <em>· declared disruptive: applies immediately, not through the mailbox.</em>" : " · routes through the mailbox like any agent update.") + "</div>"
        : '<div class="foldmeta no">not foldable — nothing on the board would change</div>';
    }
    h += "</div>";
  });
  if (t.status === "folded") {
    h += '<div class="parked-note">This thread is concluded and folded. It stays readable. ' +
      '<button class="btn sm" data-act="relitigate" data-tid="' + tid + '">Relitigate it</button></div></div>';
    return h;
  }
  h += '<div class="seeds">';
  Grill.SEEDS.forEach(function (s) {
    h += '<button class="btn sm" data-act="seed" data-tid="' + tid + '" data-seed="' + s.key + '">' + s.label + "</button>";
  });
  h += "</div>";
  h += '<div class="free"><textarea id="ft-say" data-draft="__say" placeholder="…or say something of your own"></textarea>' +
    '<button class="btn sm" data-act="say" data-tid="' + tid + '">Send</button></div>';
  if (last && last.disruptive) h += '<div class="disruptive"><strong>Concluding this is disruptive.</strong> ' + esc(last.impact.summary) + " It will apply the moment you fold, without waiting in the mailbox.</div>";
  else if (last) h += '<div class="parked-note"><strong>If folded:</strong> ' + esc(last.impact.summary) + " Queued to the mailbox like any agent update.</div>";
  else h += '<div class="parked-note">Nothing in this thread is foldable yet. Park it and it costs nothing.</div>';
  h += '<div class="thread-actions">' +
    '<button class="btn sm" data-act="park" data-tid="' + tid + '">Park it — no effect, kept on the record</button>' +
    '<button class="btn primary sm" data-act="fold" data-tid="' + tid + '"' + (last ? "" : " disabled") + '>Fold it — conclude and apply</button></div>';
  h += "</div>";
  return h;
}
function renderInbox() {
  var ns = Grill.notifications(S);
  var h = '<div class="slide"><button class="close" data-act="closepanel">✕</button>' +
    '<h3 style="font-size:16px">Notifications</h3>' +
    '<div class="muted" style="margin-bottom:12px">Everything the agent wants your attention on, in one list. A suggested thread stays out of this list while its decision is blocked.</div>';
  if (!ns.length) h += '<div class="muted">Nothing waiting.</div>';
  ns.forEach(function (n, i) {
    h += '<div class="inbox-item"><span class="type t-' + n.type + '">' + n.type.replace("-", " ") + "</span>" +
      '<div class="txt"><strong>' + (n.nodeId || "—") + "</strong> · " + esc(n.text) +
      '<div style="margin-top:6px"><button class="btn sm" data-act="notify" data-i="' + i + '">Go to it</button></div></div></div>';
  });
  h += "</div>";
  return h;
}
function renderPending() {
  var ps = Grill.pending(S);
  var h = '<div class="slide"><button class="close" data-act="closepanel">✕</button>' +
    '<h3 style="font-size:16px">Pending agent updates</h3>' +
    '<div class="muted" style="margin-bottom:12px">Structured updates the agent has sent back. None of them has touched the board. Applying is one click, all at once.</div><div class="pending-list">';
  if (!ps.length) h += '<div class="muted">The mailbox is empty.</div>';
  ps.forEach(function (p) {
    h += '<div class="pending-row"><strong>' + (p.nodeId || "—") + "</strong> · <span class=\"did\">" + p.kind + "</span><br>" + esc(p.summary) +
      (p.conflicts ? '<div class="c">⚡ conflicts with your later change to ' + p.nodeId + " — applying will raise it for judgement</div>" : "") + "</div>";
  });
  h += "</div>";
  if (ps.length) h += '<div class="thread-actions"><button class="btn primary sm" data-act="apply">Apply all ' + ps.length + "</button></div>";
  h += "</div>";
  return h;
}

/* ---------- shell ---------- */
var CHOREO_ROWS = [
  ["D1 = recommended", "informational reply on D1 (pulsing ✉ until read) and a “recommended next” of D3"],
  ["D1 = live query (option b)", "elicitative: materialises a NEW decision D17 about re-query cost"],
  ["D2 = any blocked item (option b)", "elicitative: materialises a NEW decision D18 defining “blocked”"],
  ["D2 = recommended", "informational reply on D2"],
  ["D3 = anything", "revises D5's options — this is the update that conflicts if you answer D5 before applying it"],
  ["D5 = anything", "informational reply on D5, recommends D7 next"],
  ["D6 = escalating call (option c)", "invalidates D10 — it leaves the flow, stays on the board for relitigation"],
  ["D7 = recommended", "elicitative ALERT on D7 (flashing ⚠) opening a thread whose fold is DISRUPTIVE and applies synchronously"],
  ["D8 = recommended", "suggested thread on D13 — suppressed from the inbox until D13 stops being blocked"],
  ["D11 = anything", "settles a FUTURE node: D14 is decided by the agent, not by you"],
  ["D12 = anything", "mandated thread T-auth opens immediately; the decision cannot settle until it concludes"],
  ["Reopen any settled decision", "descendants go “possibly affected”; the agent later confirms the direct ones and clears the deeper ones"],
  ["Settle D7 / settle D12", "the fog lifts off D16 / D15 — they become real questions"]
];

function renderShell() {
  var tabs = '<div class="tabs">';
  SCENARIOS.forEach(function (s, i) {
    tabs += '<button class="' + (UI.scenario === i ? "on" : "") + '" data-act="scenario" data-i="' + i + '">' + esc(s.name) + "</button>";
  });
  tabs += '<span class="spacer"></span><button class="' + (UI.scenario === null ? "on" : "") + '" data-act="freeplay">Free play</button>' +
    '<button data-act="reset">Reset</button></div>';

  var body = '<div class="scen-body">';
  if (UI.scenario === null) {
    body += "<p>Free play. Answer anything on the frontier, reopen anything settled by expanding it, start a thread on any decision, and let the agent fall behind. The choreography note above says which click produces which agent behaviour.</p>";
  } else {
    var sc = SCENARIOS[UI.scenario];
    body += "<p>" + esc(sc.blurb) + "</p><div class='steps'>";
    sc.steps.forEach(function (st, i) {
      var cls = i < UI.step ? "done" : i === UI.step ? "now" : "";
      var waiting = i === UI.step && st.wait && !st.wait(S);
      body += '<button class="step ' + cls + '" data-act="step" data-i="' + i + '"' + (i === UI.step && !waiting ? "" : " disabled") + ">" +
        '<span class="n">' + (i + 1) + "</span>" + esc(st.label) +
        (waiting ? '<span class="wait">waiting for the agent…</span>' : "") + "</button>";
    });
    body += "</div>";
    if (UI.step >= sc.steps.length) body += "<p style='margin-top:12px'><strong>Walkthrough complete.</strong> Free play is always live.</p>";
  }
  body += "</div>";

  var choreo = '<details class="note"><summary>Choreography — which click makes the fake agent do what</summary>' +
    '<p class="muted" style="margin:8px 0 0">The agent is canned but deterministic. Every behaviour below is reachable in free play by the trigger on the left; latency varies between about one and four seconds.</p>' +
    "<table><tr><th>Trigger</th><th>What the agent sends back</th></tr>";
  CHOREO_ROWS.forEach(function (r) { choreo += '<tr><td class="k">' + esc(r[0]) + "</td><td>" + esc(r[1]) + "</td></tr>"; });
  choreo += "</table></details>";

  var ps = Grill.pending(S), ns = Grill.notifications(S);
  var top = '<div class="topbar">' +
    '<span class="agentchip"><span class="dot' + (agentBusy() ? " busy" : "") + '"></span>' +
    (agentBusy() ? "agent is thinking about " + AGENT.jobs.length + " thing" + (AGENT.jobs.length > 1 ? "s" : "") : "agent is idle") + "</span>" +
    '<button class="pendbtn' + (ps.length ? "" : " none") + '" data-act="pendingpanel">✉ ' +
    (ps.length ? ps.length + " update" + (ps.length > 1 ? "s" : "") + " waiting — apply" : "mailbox empty") + "</button>" +
    (ps.length ? '<button class="btn sm primary" data-act="apply">Apply all</button>' : "") +
    '<button class="inboxbtn" data-act="inbox">🔔 Notifications <span class="count">' + ns.length + "</span></button>" +
    (agentBusy() ? '<button class="btn sm" data-act="flush">Impatient? deliver now</button>' : "") +
    "</div>";

  document.getElementById("shell").innerHTML =
    '<span class="marker">Prototype — throwaway · round 2</span>' +
    '<div class="intro"><h1>Does the asynchronous interaction model feel right?</h1>' +
    "<p>Round 1 settled the surface: a map canvas beside one blended column of answerable and settled decisions. This round is about the conversation. The agent here is fake but genuinely asynchronous — your answers apply instantly and locally, its replies come back seconds later as structured updates that sit in a mailbox and change nothing until you apply them. Where it disagrees with something you changed in the meantime, that is a conflict, and it blocks everything downstream until you judge it.</p>" +
    "<p>The question to hold while clicking: <strong>does this pending-mailbox / conflict / thread / notifications model feel right to work inside</strong> — or does the lag, the queue, or the blocking cost more than it buys?</p></div>" +
    choreo +
    '<div class="scenarios">' + tabs + body + "</div>" +
    (S.banner ? '<div class="banner">' + esc(S.banner) + "</div>" : "") +
    top +
    '<div class="surface">' + renderMap() + renderColumn() + "</div>";

  document.getElementById("overlay").innerHTML =
    !UI.panel ? "" :
    UI.panel.kind === "thread" ? renderThread(UI.panel.id) :
    UI.panel.kind === "inbox" ? renderInbox() : renderPending();
}

/* ---------- render, preserving what the user is doing ---------- */
function render() {
  var map = document.getElementById("mapscroll"), col = document.getElementById("column");
  var keep = { mx: map ? map.scrollLeft : 0, my: map ? map.scrollTop : 0, cy: col ? col.scrollTop : 0 };
  var act = document.activeElement;
  var focusId = act && act.tagName === "TEXTAREA" ? act.id : null;
  var caret = focusId ? act.selectionStart : 0;

  renderShell();

  document.querySelectorAll("textarea[data-draft]").forEach(function (ta) {
    var d = UI.drafts[ta.dataset.draft];
    if (d) ta.value = d;
  });
  var map2 = document.getElementById("mapscroll"), col2 = document.getElementById("column");
  if (map2) { map2.scrollLeft = keep.mx; map2.scrollTop = keep.my; }
  if (col2) col2.scrollTop = keep.cy;

  if (UI.centerNext && UI.focus) { centerOn(UI.focus); UI.centerNext = false; }

  if (focusId) {
    var again = document.getElementById(focusId);
    if (again) { again.focus(); try { again.setSelectionRange(caret, caret); } catch (e) {} }
  } else if (UI.focus !== UI.lastFocus || document.activeElement === document.body) {
    // A3: the focused decision's free-text box holds focus by default. Only
    // ever taken when nothing else holds it, so typing is never interrupted.
    var box = document.getElementById("ft-" + UI.focus);
    if (box && !UI.panel) box.focus();
  }
  UI.lastFocus = UI.focus;
}
// S2: the map auto-centres on whatever the column is focused on, and vice versa.
function centerOn(id) {
  var map = document.getElementById("mapscroll"), p = POS[id];
  if (map && p) {
    map.scrollLeft = Math.max(0, p.x - map.clientWidth / 2 + 58);
    map.scrollTop = Math.max(0, p.y - map.clientHeight / 2 + 26);
  }
  var col = document.getElementById("column"), item = document.getElementById("col-" + id);
  if (col && item) col.scrollTop = Math.max(0, item.offsetTop - 14);
}

/* ---------- events ---------- */
document.addEventListener("input", function (e) {
  if (e.target.dataset && e.target.dataset.draft) UI.drafts[e.target.dataset.draft] = e.target.value;
});

document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var a = el.dataset.act, id = el.dataset.id, tid = el.dataset.tid;
  switch (a) {
    case "mapnode": {
      var v = nv(id);
      focusOn(id);
      if (v.conflict) { openThread(v.conflict.threadId); return; }
      if (v.status === "settled") UI.open[id] = true;
      render();
      break;
    }
    case "focus":
      if (e.target.tagName === "TEXTAREA" || e.target.closest("button")) return;
      focusOn(id); render();
      break;
    case "expand": focusOn(id); UI.open[id] = true; render(); break;
    case "collapse": UI.open[id] = false; render(); break;
    case "pick":
      dispatch({ type: "answer", id: id, payload: { optionId: el.dataset.opt } });
      UI.open[id] = false; render();                    // B1: settle and collapse in one motion
      break;
    case "free": {
      var ta = document.getElementById("ft-" + id);
      if (!ta || !ta.value.trim()) return;
      dispatch({ type: "answer", id: id, payload: { free: true, text: ta.value.trim() } });
      UI.drafts[id] = ""; UI.open[id] = false; render();
      break;
    }
    case "history": UI.open["hist-" + id] = !UI.open["hist-" + id]; render(); break;
    case "threads": {
      var ts = Grill.threadsOf(S, id);
      if (ts.length) openThread(ts[ts.length - 1]);
      else { dispatch({ type: "newThread", id: id }); openLatestThread(); }
      break;
    }
    case "newthread": dispatch({ type: "newThread", id: id }); openLatestThread(); break;
    case "openthread": openThread(tid); break;
    case "relitigate": dispatch({ type: "relitigate", id: tid }); openLatestThread(); break;
    case "seed": dispatch({ type: "threadSeed", id: tid, seed: el.dataset.seed }); break;
    case "say": {
      var sa = document.getElementById("ft-say");
      if (!sa || !sa.value.trim()) return;
      dispatch({ type: "threadSay", id: tid, text: sa.value.trim() });
      UI.drafts.__say = ""; render();
      break;
    }
    case "park": dispatch({ type: "parkThread", id: tid }); UI.panel = null; render(); break;
    case "fold": dispatch({ type: "foldThread", id: tid }); UI.panel = null; render(); break;
    case "readinfo": dispatch({ type: "seen", id: id }); break;
    case "apply": dispatch({ type: "applyPending" }); if (UI.panel && UI.panel.kind === "pending") UI.panel = null; render(); break;
    case "pendingpanel": UI.panel = { kind: "pending" }; render(); break;
    case "inbox": UI.panel = { kind: "inbox" }; render(); break;
    case "closepanel": UI.panel = null; render(); break;
    case "flush": flushAgent(); break;
    case "notify": {
      var n = Grill.notifications(S)[+el.dataset.i];
      if (!n) return;
      if (n.nodeId) focusOn(n.nodeId);
      if (n.action === "thread") openThread(n.threadId);
      else if (n.action === "conflict") openThread(S.conflicts[n.nodeId].threadId);
      else if (n.action === "pending") { UI.panel = { kind: "pending" }; render(); }
      else { UI.panel = null; if (n.type === "informational") dispatch({ type: "seen", id: n.nodeId }); else render(); }
      break;
    }
    case "scenario": startScenario(+el.dataset.i); break;
    case "freeplay": UI.scenario = null; UI.step = 0; render(); break;
    case "reset": resetAll(); break;
    case "step": {
      var sc = SCENARIOS[UI.scenario];
      if (+el.dataset.i !== UI.step) return;
      sc.steps[UI.step].run();
      UI.step++;
      render();
      break;
    }
  }
});

/* hover overlay on map nodes — A4 */
var HOVER = null;
document.addEventListener("mouseover", function (e) {
  var n = e.target.closest(".mnode");
  if (!n) return;
  var v = nv(n.dataset.id);
  if (!HOVER) { HOVER = document.createElement("div"); HOVER.className = "hovercard"; document.body.appendChild(HOVER); }
  HOVER.innerHTML = '<div class="hid">' + (v.fogged ? "fogged" : v.id) + " · " + LABELS[v.status] + "</div>" +
    "<div><strong>" + esc(v.title) + "</strong></div>" +
    (v.body ? "<div>" + esc(v.body.slice(0, 150)) + (v.body.length > 150 ? "…" : "") + "</div>" : "") +
    (v.answerText ? '<div style="opacity:.75;margin-top:4px">→ ' + esc(v.answerText.slice(0, 110)) + "</div>" : "");
  var r = n.getBoundingClientRect();
  HOVER.style.left = Math.min(window.innerWidth - 320, r.left) + "px";
  HOVER.style.top = (r.bottom + 8) + "px";
  HOVER.style.display = "block";
});
document.addEventListener("mouseout", function (e) {
  if (e.target.closest(".mnode") && HOVER) HOVER.style.display = "none";
});

/* drag to pan the map */
var DRAG = null;
document.addEventListener("mousedown", function (e) {
  var m = e.target.closest("#mapscroll");
  if (!m || e.target.closest(".mnode")) return;
  DRAG = { el: m, x: e.clientX, y: e.clientY, sl: m.scrollLeft, st: m.scrollTop };
  m.classList.add("grabbing");
  e.preventDefault();
});
document.addEventListener("mousemove", function (e) {
  if (!DRAG) return;
  DRAG.el.scrollLeft = DRAG.sl - (e.clientX - DRAG.x);
  DRAG.el.scrollTop = DRAG.st - (e.clientY - DRAG.y);
});
document.addEventListener("mouseup", function () {
  if (DRAG) DRAG.el.classList.remove("grabbing");
  DRAG = null;
});

/* the only global key handler: Escape closes a slide-out, and never while typing */
document.addEventListener("keydown", function (e) {
  var t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "Escape") { UI.panel = null; render(); }
});

document.addEventListener("DOMContentLoaded", render);
</script>

<div class="shell" id="shell"></div>
<div id="overlay"></div>

</body>
</html>
